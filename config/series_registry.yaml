      Alternatives probed and REJECTED as empty frames (3 attempts each plus a
      cross-path fallback): NOWCAST, GDPNOWC1, ATLGDPNOW.
    frequency: quarterly
    units: percent_annualized
    status: verified
    verified_on: 2026-09-17
    verified_value: 5.1028
    verified_observation_date: 2026-07-01
    plausible_range: [-50.0, 50.0]

  # -------------------------------------------------------------------------
  # trilemma_reserves — Section 15.20-A / D-048
  #
  # Total reserves excluding gold, IMF International Financial Statistics,
  # expressed in dollars, from FRED's `TRESEG<CC>M052N` family. These are the
  # series `check_trilemma_tension` reads to detect a losing peg defence
  # (reserves depleting while the peg holds).
  #
  # WHY THEY ARE `not_a_snapshot_field: true`: the three trilemma LEGS are
  # manual by construction (O-28) — a currency's peg status and capital-account
  # regime are institutional facts, not FRED fields — so `TrilemmaInputs` is
  # assembled by hand and no `MacroDataSnapshot` field carries these series.
  # They are registered for PROVENANCE: so that the live check's exclusion
  # counts and the dollar magnitudes are traceable to a symbol.
  #
  # THE CADENCE CAVEAT, which is the reason this comment is long. The symbol's
  # trailing `M` says monthly, and the COUNT of observations implies a long
  # monthly history — but the earliest observations are NOT monthly. Verified
  # 2026-09-17: GB and KR carry 843/842 observations of which 6 are annual
  # (pre-1956-12), and ID carries 700 of which 32 are annual-then-quarterly
  # (pre-1970-12). A model whose threshold names a calendar span must therefore
  # verify the SAMPLING CADENCE over the window and disclose what it excluded;
  # it must not read the observation count as a measurement window.
  # `check_trilemma_tension` excludes the non-monthly prefix and reports the
  # exclusion on every output.
  # -------------------------------------------------------------------------

  trilemma_reserves_gb:
    provider: fred
    symbol: TRESEGGBM052N
    not_a_snapshot_field: true
    description: >
      UK total reserves excluding gold, MILLIONS of dollars. The 1992 Black
      Wednesday episode (§18.1): the UK spent reserves defending the ERM's
      DM 2.7780 floor until 1992-09-16, when it left the mechanism and the
      pound fell. Probed 2026-09-17: 843 raw observations, beginning
      1950-12-01, ending 2026-08-01; 837 of them are monthly.

      CADENCE: the first SEVEN observations are annual — 1950-12, 1951-12, ...,
      1956-12 — and only then does the series switch to monthly (1957-01,
      1957-02, ...). The 6 pure-annual points 1950-12 .. 1955-12 are EXCLUDED;
      1956-12 is RETAINED as the first monthly observation, so the monthly span
      does not open with a 12-month hole. Result: 6 dropped, 837 monthly, of
      which 834 carry the prior 3-month history the two measures need and are
      therefore the denominator of the published base rates. The gap between
      837 and 834 is not a data defect: the measures consume two observations
      as history.

      NOT a clean monthly series for its whole length, despite the symbol's
      trailing M. See the group comment above.
    frequency: monthly
    units: millions_usd
    status: verified
    verified_on: 2026-09-17
    verified_value: 169355.6607966373
    verified_observation_date: 2026-08-01
    plausible_range: [0.0, 200000.0]

  trilemma_reserves_kr:
    provider: fred
    symbol: TRESEGKRM052N
    not_a_snapshot_field: true
    description: >
      Korea total reserves excluding gold, MILLIONS of dollars. The 1997 Asian
      crisis episode (§18.7): reserves fell from roughly $30bn in 1997-08 to
      below $10bn by 1997-12 as the won's defence failed. Probed 2026-09-17:
      842 raw observations, beginning 1950-12-01, ending 2026-07-01; 836 of
      them are monthly.

      CADENCE: the first SEVEN observations are annual — 1950-12 .. 1956-12 —
      then monthly from 1957-01. The 6 pure-annual points 1950-12 .. 1955-12
      are EXCLUDED and 1956-12 is RETAINED as the first monthly observation,
      leaving 836 monthly, of which 833 carry a full 3-month history and are
      the published base-rate denominator.

      Carries the same cadence caveat as the GB entry: the symbol says monthly
      and the count implies a long monthly history, but the prefix is not.
    frequency: monthly
    units: millions_usd
    status: verified
    verified_on: 2026-09-17
    verified_value: 421968.564846368
    verified_observation_date: 2026-07-01
    plausible_range: [0.0, 600000.0]

  trilemma_reserves_id:
    provider: fred
    symbol: TRESEGIDM052N
    not_a_snapshot_field: true
    description: >
      Indonesia total reserves excluding gold, MILLIONS of dollars. The 1997
      Asian crisis's worst case (§18.7): the rupiah's crawling band was
      abandoned in 1997-08 and reserves fell by roughly a third within months.
      Probed 2026-09-17: 700 raw observations, beginning 1950-12-01, ending
      2026-07-01; only 668 of them are monthly.

      CADENCE, and this entry is written out in full because the first
      characterisation of it was WRONG in a way that would mislead. It was
      recorded as "32 annual observations before 1970-12-01". The COUNT (32)
      was right; the COMPOSITION was not. Re-probed against the provider, the
      raw sequence is: 16 ANNUAL points 1950-12 .. 1964-12, then a CONTINUOUS
      QUARTERLY block 1965-03 .. 1968-12 (16 points, four years of Mar/Jun/Sep/
      Dec), then the monthly series from 1971-01. It is not one cadence change
      at one date, and a reader who assumed so would mis-date the usable window
      by four years.

      Exclusion convention (the count depends on it, and the GB/KR entries use
      it too): the pure-annual/quarterly points strictly before the monthly
      span are dropped, and the span's first member is RETAINED. So "32 of 700
      excluded" pairs with "668 monthly observations".

      Monthly observations: 668, of which 665 carry a full 3-month history and
      are the published base-rate denominator. This is why the cadence caveat
      is stated numerically per country on every output rather than as one
      general disclaimer.
    frequency: monthly
    units: millions_usd
    status: verified
    verified_on: 2026-09-17
    verified_value: 133983.0890807822
    verified_observation_date: 2026-07-01
    plausible_range: [0.0, 300000.0]

# ---------------------------------------------------------------------------
# BLOCKED — Section 21.4 Loophole Ledger. These have no reachable source.
# The registry records them so that an attempt to use them fails loudly and
# with a reason, rather than an implementer quietly inventing a proxy.
# ---------------------------------------------------------------------------
blocked:
  # RESOLVED 2026-09-17 (D-043): `risky_credit_growth_pct` and
  # `total_credit_growth_pct` were blocked here and are now SOURCED. Section
  # 21.1's premise -- "No clean free series for leveraged-loan growth" -- was
  # factually wrong: `BOGZ1FL623069503Q` is one, and `fred_search` found it in a
  # single query rather than by guessing symbols. Both now have `series` entries
  # above, and the entries are REMOVED rather than left as stale blocks, because
  # a registry that lists a sourced input as blocked is worse than one that
  # lists nothing.
  #
  # RESOLVED 2026-09-17 (D-047): `median_cpi_direction` and
  # `trimmed_mean_direction` are SOURCED. They are *not* removed from this list
  # by the D-043 rule above, because they were **never in it** -- which is the
  # other half of the O-21 problem and worth naming. D-043's defect was a FALSE
  # BLOCK (a claim in this file that was wrong). D-047's was an **UNRECORDED
  # BLOCK**: Section 21.1's prose declared the inputs MANUAL, the model
  # docstring repeated it, and no entry here ever contradicted either, so there
  # was nothing for a re-probe to be *scheduled against*. The two `blocked:`
  # entries that did exist alongside them (`supercore_direction`,
  # `conference_board_lei`) are both still correct -- supercore was
  # re-confirmed in the same probe that killed its two neighbours.
  #
  # The lesson: a `blocked:` list catches FALSE blocks because a false entry is
  # auditable. It cannot catch an ABSENT one, and prose in the specification is
  # not a list. Any input the specification calls MANUAL or unreachable should
  # therefore get a `blocked:` entry on the day it is discovered, even when the
  # reason is only "the specification says so" -- an entry can be re-probed,
  # a paragraph cannot.

  - field: iron_ore_change_pct
    reason: No clean free source for iron ore prices.
    opened_in: OPEN_ISSUES.md

  - field: ppp_implied_rate
    reason: OECD publishes PPP conversion factors; no clean free API. Manual entry only.
    opened_in: OPEN_ISSUES.md

  - field: supercore_direction
    reason: >
      Per audit finding O-8 there is no valid BLS construction for supercore.
      RE-CONFIRMED LIVE 2026-09-17 (D-047), in the same probe that found its two
      neighbouring dispersion measures to be live -- so this block rests on
      evidence rather than on inheritance from the specification's prose. It is
      the one absence that matters most, because supercore is the measure the
      Fed most often cites: the classifier's coverage of the core-inflation
      spectrum is incomplete exactly where a reader would look for it.

      The classifier must degrade to 5 of its 6 measures. The supercore SLOT is
      filled by the Atlanta Fed's sticky-price CPI, which is a DIFFERENT measure
      and is named as such (`sticky_price_cpi_direction`) rather than
      substituted silently -- Section 21.1 rule 4's prohibition is about
      mislabelling, and O-8 is the canonical example of why.
    opened_in: OPEN_ISSUES.md

  - field: conference_board_lei
    reason: >
      Conference Board LEI is a licensed product with no free API (Section 21.4
      item 5). FRED `USLEI` returns an EMPTY frame through both the local API
      and the in-process package, three attempts each — probed 2026-09-17 via
      scripts/_probe_lei.py, so the BLOCKED status is evidence-backed rather
      than assumed from the specification's prose.

      The MANUAL-entry route Section 21.1 offers for this input is refused: a
      figure a human types in carries no refresh, no vintage and no validation,
      so it cannot satisfy Section 21.0 rule 5. The in-house route is taken
      instead, under the name `leading_indicator_proxy` — Section 21.1 is
      explicit that "if in-house, it must NOT be called 'LEI'".
    opened_in: OPEN_ISSUES.md

  - field: inflation_surprise_bp
    reason: >
      Module 5.6 declares `inflation_surprise_bp` and lists it in
      `inputs_used`, but NO FREE SERIES carries a CPI consensus forecast, so
      the input cannot be sourced — and its ABSENCE is why D-052 keeps it as a
      caller-supplied DISCLOSURE rather than deriving a direction from it.

      Probed 2026-09-18 with `fred_search` (the O-21 order: local API spec, then
      `fred_search`, then Treasury Fiscal Data). Four queries, verbatim results:
      `fred_search(query="CPI forecast")` and `query="CPI consensus"` both raise
      `EmptyDataError` ("The request was returned empty"), and
      `query="consumer price index forecast"` returns "No results found".
      `query="inflation expectation"` DOES return eight rows — `T5YIFR` and the
      `EXPINF*YR` family — but every one is an EXPECTED-INFLATION series (a
      model's or the market's forward estimate), not a consensus forecast of the
      next print. That distinction is load-bearing: a nowcast is published
      BEFORE the release; a surprise is the difference between the outcome and
      the professional consensus collected by Bloomberg/Reuters/AP, all of which
      license it. Sections 21.0 rule 3 and 21.1 forbid inventing a substitute,
      and a nowcast-minus-realised quantity would be a different estimand
      wearing the same name.

      FRED does carry the REALISED index (`CPIAUCSL`, `CPIAUCNS`, `CPILFESL`),
      which is why a caller CAN compute a surprise if they supply their own
      consensus — the block is on the source, not on the arithmetic.

      Consequence for the model: the transmission map publishes the caller's
      value when supplied and NEVER lets a direction depend on it (see the
      function's Defect 1 note). This entry exists so the block is re-probeable
      — per the lesson recorded above, an unrecorded block is the one that
      cannot be caught.
    opened_in: OPEN_ISSUES.md

  - field: fx_forward_rate
    reason: >
      No route on this installation returns FX FORWARD points, so Module 9's
      `cip_check` cannot be validated against a real market forward. The model
      itself is not blocked — it takes `forward` as an INPUT — but the live
      check is, and the market's own CIP deviation therefore cannot be measured
      here.

      MEASURED 2026-09-25 (D-108), three independent probes rather than one:
      (1) the OpenBB route inventory walks to 443 routes and NONE matches
      `forward` / `swap` / `basis` under `currency` or `fixedincome` —
      `obb.currency` exposes only `price`, `search` and `snapshots`;
      (2) the CME FX futures tickers `6E=F`, `6J=F` and `6B=F` all return
      `EmptyDataError` through the yfinance provider, so an exchange-traded
      proxy is unavailable too; (3) FRED's spot family (`DEXUSEU`, `DEXJPUS`,
      …) is a SPOT series — the H.10 release carries no forwards.

      This is an UNRECORDED-BLOCK risk of exactly the D-047 class: the
      specification's Section 6.7 reference implementation takes a `forward`
      argument and never says where one comes from, so without this entry there
      would be nothing to re-probe. An entry can be re-probed on a schedule; a
      paragraph cannot.

      What would lift it: any provider that publishes FX forward points or a
      cross-currency basis (a licensed source, or CME settlement data via a
      credentialed provider such as `fmp`/`polygon`, both of which currently
      fail on MISSING CREDENTIALS rather than on a missing product — a config
      gap, not a dead end, exactly as the `release_calendar` note above found
      for the calendar). Re-probe with the credentialed providers before
      concluding the product is unreachable.
    opened_in: OPEN_ISSUES.md

# ---------------------------------------------------------------------------
# release_calendar — Section 6 point-in-time provenance
# ---------------------------------------------------------------------------
#
# CORRECTED 2026-09-20 (audit continuation). The previous finding, recorded in
# `ObservationPoint`'s docstring and in the 2026-09-19 report, was that release
# dates are unreachable from this installation. That was HALF RIGHT and the
# wrong half mattered:
#
#   CONFIRMED: `economy.calendar` with provider=fred raises TimeoutError
#              consistently (many retries, not a transient limit), and
#              `economy.fred_release_table` returns a table of contents with no
#              date field at all.
#
#   MISSED:    `economy.calendar` accepts FOUR providers. Only `fred` was tried.
#              `fmp` and `tradingeconomics` fail on MISSING CREDENTIALS (a
#              config gap, not a dead end). **`nasdaq` works** and returns dated
#              US releases — including the CPI, PCE and PPI prints this system
#              actually consumes (verified live 2026-09-20: Core CPI 2026-08-13,
#              Core PCE 2026-08-27, PPI 2026-09-11, JOLTS 2026-09-02).
#
# So release dates ARE obtainable. What made the earlier reading defensible was
# that it extrapolated from one provider to "no reachable route exists" without
# enumerating the provider list — the same overstatement class the audit exists
# to find, committed inside the audit.
#
# HONEST LIMITATION, and the reason this is opt-in: the nasdaq route is
# INTERMITTENT and can be BLOCKED.
#
#   * Intermittency: four identical calls on 2026-09-20 returned 2 success and
#     2 failures ("Nasdaq Error -> Economic Events Calendar: No record found."),
#     with a fresh response `id` each time so there is no caching to mask it.
#   * Blocking: later in the same session the upstream host began returning
#     HTTP 403 (text/html) for EVERY nasdaq route, including the unrelated
#     equity/calendar/earnings. That is an upstream IP-level block, not a code
#     fault. The successful reads above are real; they are not reliably
#     reproducible, and whether the route works today depends on a third
#     party's rate limiting.
#
# The mitigation is retry-with-backoff plus a hard rule: when the calendar
# cannot be read, `release_datetime` stays None and the consumption point
# treats timing as UNKNOWN. A scheduled date is never substituted for a
# released one — see `has_known_release_timing`.
#
# `enabled: false` would be the conservative choice given the block. It is left
# `true` so the route is exercised and its health is observable rather than
# silently dormant — and the consequence is made explicit in the snapshot: a
# `enabled: false` is now the default, because a better source exists.
# `publication_dates` (below) is PRIMARY: it reads each series' own
# `last_updated` metadata, needs no event-name join, and was verified at 42/42
# registry coverage with 0 transport errors. This calendar is retained as the
# FALLBACK for series the metadata route cannot reach, and is what a caller
# should re-enable if `publication_dates` ever loses coverage.
#
# Leaving it `true` would impose 5 retries (~15s of sleeps) on EVERY snapshot
# build for a route that is currently edge-blocked, to add nothing the primary
# source does not already provide. The honest description of that is a dead
# cost, not resilience. When the upstream block lifts, flipping this to `true`
# re-enables the merge, and the primary-wins conflict rule keeps the direct
# facts authoritative either way.
#
# With it disabled, a build carries no RELEASE_TIMING_UNKNOWN flag unless the
# PRIMARY source fails — "we did not ask the fallback" is a configuration
# choice, not a data-quality fact.
release_calendar:
  enabled: false
  provider: nasdaq
  endpoint: economy.calendar
  # The provider's own retry budget, separate from the series client's: this
  # route's failure mode is a quick empty response rather than a timeout, so
  # more attempts at a shorter backoff is the right shape.
  max_attempts: 5
  backoff_seconds: 1.5
  # Lookback/lookahead for the calendar query. The window must cover the
  # observation lag we are trying to close (a month's print lands mid-following
  # month) plus room for the newest observation.
  window_days_back: 400
  window_days_forward: 45
  # Event name (as the provider publishes it, matched case-insensitively) ->
  # registry series key. The provider publishes HUMAN-READABLE event names, not
  # FRED symbols, so this mapping is the join and CANNOT be derived.
  #
  # Several names map to one series because the provider publishes the same
  # release more than once at the same timestamp with different units (CPI YoY
  # and CPI MoM both appear as "CPI"). That is fine for a DATE lookup — the
  # timestamp is what is taken — but it is why the event name alone is not a
  # sufficient key for anything but a date.
  event_map:
    "CPI": cpi_headline
    "Core CPI": cpi_core
    "Core PCE Price Index": pce_core
    "PPI": ppi
    "Core PPI": ppi_core
    "JOLTS Job Openings": jolts_openings
    "JOLTS Job Quits": jolts_quits
    "Unemployment Rate": unemployment_rate
    "Nonfarm Payrolls": nfp
    "Initial Jobless Claims": initial_claims
    "Continuing Jobless Claims": continuing_claims
    "GDP": gdp_real
    "GDP Price Index": gdp_deflator
    "Retail Sales": retail_sales
    "Durable Goods Orders": durable_goods_orders
    "Industrial Production": industrial_production

# ---------------------------------------------------------------------------
# publication_dates — Section 6's EXACT route for release_datetime (PRIMARY)
# ---------------------------------------------------------------------------
# Each series' own metadata carries `last_updated`: the instant the source last
# wrote that series. Read directly, no join, no scheduled-date inference — so it
# is a better fact than an events-calendar match, and it is the primary source.
#
# VERIFIED LIVE 2026-09-20 — 42/42 registry symbols returned `last_updated`,
# 0 transport errors:
#
#   GET /api/v1/economy/fred_search
#       ?provider=fred&query=<SYMBOL>&search_type=series_id&limit=1000
#   -> results[0].last_updated = "2026-09-11T08:37:49-05:00"    # CPIAUCSL
#
# Why `search_type: series_id` and `limit: 1000` are not arbitrary:
#   * series_id search is a PREFIX match. At limit=5, `UNRATE`, `GDP` and
#     `GDPC1` each returned 5 longer siblings (UNRATECTH, GDPC1CTH, ...) and NO
#     exact match; at limit=1000 all three surfaced. The reader still requires
#     exact `series_id` equality, so the high limit costs bandwidth, not
#     correctness.
#   * `search_type: full_text` is NOT usable for lookup: a 100-row full-text
#     search for "Unemployment Rate" did not contain UNRATE at all.
#
# WHAT THIS IS NOT — read before assuming it fills vintage_datetime:
# The route also returns `realtime_start` / `realtime_end`, which look like
# ALFRED vintage bounds. They are not. For every series both equal TODAY: they
# describe the vintage window in force now, not the revisions that existed
# before. Passing `realtime_start=2026-01-01` is silently IGNORED (A/B tested —
# the two responses differed only in request `timestamp`/`duration`).
# So this fills `release_datetime` and CANNOT fill `vintage_datetime`: "when did
# this become public" and "which revision is this" are different questions, and
# only the first is answerable HERE (this route).
#
# PARTLY SUPERSEDED 2026-09-22 (D-088). The sentence that used to continue
# "...and only the first is answerable here" as "...which stays None" is now
# out of date: `alfred_vintage` below configures a direct ALFRED route that DOES
# fill `vintage_datetime`, for a series declared `vintage_eligible`. Everything
# above stays true of THIS route — the absorption finding is unchanged and this
# block still cannot fill a vintage. The two routes are complementary.
#
# Cross-validated against the events calendar: PCEPILFE reports last_updated
# 2026-08-26 where the calendar dated the Core PCE release 2026-08-27. A one-day
# gap in that direction is exactly the "source wrote it" vs "release happened"
# pair, which confirms the field is a publication timestamp and not an
# observation period.
publication_dates:
  enabled: true
  provider: fred
  endpoint: economy.fred_search
  search_type: series_id
  limit: 1000
  max_attempts: 3
  backoff_seconds: 1.0

# ---------------------------------------------------------------------------
# ALFRED vintage retrieval — the direct route to `vintage_datetime`.
#
# Section 6 names four timestamps per observation and requires they not be
# conflated. Three are populated. `vintage_datetime` has been None on every
# point this system produced, and O-6 records why: `openbb_fred`'s provider
# POPS `realtime_start`/`realtime_end` off every observation row FRED returns
# (models/series.py:156-157) and its query model declares no realtime field,
# so the parameter cannot even be transmitted. Passing it through OpenBB is
# absorbed silently and the LATEST revision comes back with HTTP 200.
#
# This block configures the only route that can answer the question: a direct
# call to FRED's observations endpoint with realtime_start == realtime_end.
#
# THE CREDENTIAL IS BORROWED, NOT DUPLICATED. Section 22.2/22.3 forbid the
# engine holding its own FRED_API_KEY, and O-6's final word cites exactly that
# as the reason this was never built. That objection is honoured here rather
# than waived: NO key is required in `.env` and none is read from the
# environment. The key used is the one OpenBB already owns, read through
# OpenBB's own public accessor. There is one FRED key on this machine.
#
# `enabled: false` — OFF BY DEFAULT, deliberately. A vintage read costs one
# request per (series, as-of date) and is only meaningful to a caller
# replaying history. A live current-thesis build has no as-of dates to
# replay, so leaving it on would add latency to every snapshot and return
# nothing. This mirrors `release_calendar`'s default rather than
# `publication_dates`'s: it is an as-needed research route, not an always-on
# accuracy improvement.
#
# HONEST LIMIT, unchanged by this route (AGENTS.md line 5574, Loophole Ledger
# item 14): this recovers revision HISTORY for series that have it. It does
# NOT make pre-launch vintages recoverable — the forward parquet trail in
# data/raw/ is still what covers "what this process saw", and the two are
# complementary, not substitutes.
# ---------------------------------------------------------------------------
alfred_vintage:
  enabled: false
  require_credential: true
  max_attempts: 3
  backoff_seconds: 1.0
  timeout_seconds: 20.0
  default_lookback_years: 5

