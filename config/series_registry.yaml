  # ------------------------------------------------ Module 3.4 BLOCKED inputs
  # Both of Module 3.4's credit-growth inputs are in the `blocked:` list at the
  # foot of this file, where Section 21.4's Loophole Ledger keeps them. They have
  # no `series` entries: FRED's total bank credit, total loans and C&I loans are
  # NOT measures of the leveraged-loan segment the specification names, and
  # Section 21.1 forbids the substitution outright. See D-041 and O-20.

  leveraged_loan_holdings:
    provider: fred
    symbol: BOGZ1FL623069503Q
    not_a_snapshot_field: true
    description: >
      Hedge Funds (Domestic); Leveraged Loans; Asset, Level -- from the Fed's Z.1
      Financial Accounts, in MILLIONS of dollars, quarterly. Module 3.4's
      `risky_credit_growth_pct`.

      **THIS SERIES LIFTS A BLOCK THAT SECTION 21.1 SAID COULD NOT BE LIFTED.**
      The registry listed this input BLOCKED with the reason "No clean free series
      for leveraged-loan growth". That was wrong, and `fred_search` found the
      series in one query. See D-043.

      **TWO LIMITATIONS, both material.**

      (1) It measures HEDGE FUNDS' leveraged-loan holdings, not the whole
      leveraged-loan market. Right asset class, narrower holder base.

      (2) **It reads exactly ZERO for 90 of its 145 common quarters -- 1990-Q2
      through 2012-Q3.** That is a structural break in the Z.1 accounts, not a
      statement that hedge funds held nothing, and growth is undefined across it.
      The usable history is therefore **51 quarters, 2013-Q4 onward**, which
      includes the 2020 stress but not the 2008 crisis. A caller must drop the
      zero-denominator quarters rather than impute them.
