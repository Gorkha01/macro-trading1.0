  # ------------------------------------------------------------ Yield curve
  # D-086: ONE call replaces eleven, via the Fed's own H.15 curve command.
  # The Treasury.gov route (fixedincome.government.treasury_rates) is the
  # alternative; both are `federal_reserve` and both return the same H.15
  # source, so the cheaper single-call `yield_curve` is used.
  #
  # TWO facts had to be declared rather than assumed, and both are silent
  # 100x-or-mis-assignment defects if guessed:
  #  * `tenor_labels` — the command names tenors `month_1`/`year_10` while this
  #    registry (and every downstream consumer) uses `1mo`/`10yr`.
  #  * `source_units: decimal` — the command returns `rate` as a DECIMAL
  #    (0.0494) whereas `economy.fred_series` returns PERCENT (4.94) for the
  #    same observation date. Verified live 2026-09-21 on DGS10 vs year_10.
  treasury_curve:
    provider: federal_reserve
    endpoint: fixedincome.government.yield_curve
    snapshot_field: yield_curve
    source_units: decimal
    # Measured live 2026-09-21: this route IGNORES `start_date`. With
    # `start_date=2026-09-15` and with no `start_date` at all the response was
    # IDENTICAL — 11 rows, every one dated 2026-09-17. It is a latest-only
    # snapshot endpoint. Declaring False makes the fetcher OMIT the parameter
    # instead of sending a window the provider discards; sending it anyway would
    # claim a bounded window that does not exist.
    window_filter_supported: false
    tenors:
      1mo: DGS1MO
      3mo: DGS3MO
      6mo: DGS6MO
      1yr: DGS1
      2yr: DGS2
      3yr: DGS3
      5yr: DGS5
      7yr: DGS7
      10yr: DGS10
      20yr: DGS20
      30yr: DGS30
    tenor_labels:
      1mo: month_1
      3mo: month_3
      6mo: month_6
      1yr: year_1
      2yr: year_2
      3yr: year_3
      5yr: year_5
      7yr: year_7
      10yr: year_10
      20yr: year_20
      30yr: year_30
    description: >
      Treasury constant-maturity yields, daily, percent.
      NOTE: registry key is `treasury_curve` but it populates the schema field
      `yield_curve`; declared via `snapshot_field` above rather than assumed.
      The `symbol`/`tenors` values are retained as documentation of the exact
      FRED series each tenor corresponds to and are NOT sent to the provider on
      this route; `tenor_labels` is what joins the response.
    frequency: daily
    units: percent
    status: verified
    verified_on: 2026-09-21
    verified_value: 4.94
    verified_curve: {1mo: 3.97, 3mo: 4.12, 6mo: 4.2, 1yr: 4.4, 2yr: 4.67, 3yr: 4.75, 5yr: 4.78, 7yr: 4.86, 10yr: 4.94, 20yr: 5.32, 30yr: 5.29}

