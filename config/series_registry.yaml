  # Appendix D's `central_bank_net_purchases_trend` ("rising" | "flat" |
  # "falling") is a DISCRETE trend label over central-bank net gold purchases.
  # Unlike the five FALSE blocks this repository has caught, this one was
  # PROBED and CONFIRMED, making it the SECOND CONFIRMED block (after
  # `usd_denominated_debt_share`, D-119).
  #
  # MEASURED 2026-09-27, three separate facts, none of which is "no such series":
  #
  #   * The World Bank publishes `FI.RES.GOLD.CD` — "Gold Holdings at London
  #     market price (US$ end period)" — in its indicator CATALOGUE (it appears
  #     among the 29,544 ids returned by `api.worldbank.org/v2/indicator`), so a
  #     NAME-GREP finds it and would call the leg sourced. **But the DATA route
  #     refuses the id**: `/country/USA/indicator/FI.RES.GOLD.CD` answers with
  #     message **id 175, "The indicator was not found. It may have been deleted
  #     or archived."**, and no rows — the same for the `WLD` aggregate. A
  #     control (`FI.RES.TOTL.CD`) returns populated points from the same route
  #     and the same caller, so the refusal is about THIS id, not the request.
  #     **"In the catalogue" and "serves data" are DIFFERENT CLAIMS**, which is
  #     why the probe measured the PAYLOAD and not the name.
  #   * The client's own error names a missing `lastupdated` date. That is the
  #     SYMPTOM it detects, not the cause: the `/indicator/` metadata route
  #     reports `lastupdated=None` for a WORKING indicator too (measured:
  #     `FI.RES.TOTL.CD` as well). The decisive evidence is the data route's
  #     id-175 refusal.
  #   * `FI.RES.TOTL.GD.ZS` is **not a valid indicator id** — it is ABSENT from
  #     the catalogue and the API rejects the id — so it is not a fallback.
  #   * Even with data, `FI.RES.GOLD.CD` would be the WRONG ESTIMAND: it is a
  #     USD VALUE at London market price, so a rise in it conflates a PRICE move
  #     with a BUYING decision. Deriving a "purchases trend" from it would be a
  #     category error — the same class as reading a stock level as a flow.
  #
  # The leg is therefore a MANUAL input with a discriminating disclosure. The
  # model does NOT guess it from anything, and its absence is published as
  # "inactive by data availability", explicitly NOT as "evidence that CB buying
  # is flat".
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # FX RESERVES for `intervention_capacity` (Section 20.9). Section 20.9's
  # reference implementation declares `fx_reserves_usd_bn` and
  # `reserves_to_gdp_pct` with NO source, and no entry existed here — which under
  # Section 21.1's default rule ("any input not listed above is BLOCKED by
  # default") makes them BLOCKED. Measured 2026-09-27, that reading is FALSE.
  #
  # This is the FOURTH FALSE BLOCK this repository has caught (D-043's class,
  # after `ppp_implied_rate` at D-115/D-117). The series below are "Total
  # Reserves excluding Gold", monthly, from FRED — the same route the rest of
  # this registry uses, so the wiring introduces no new dependency class.
  #
  # ⚠️ THE UNIT IS MILLIONS AND IT IS THE DEFECT THIS COMMENT PREVENTS.
  # `TRESEGJPM052N` reads 1083420.49, i.e. USD 1.083 TRILLION; a reader who
  # treats that as billions is off by 1000x and the number still looks like a
  # reserve stock at either scale. The registry's `units` field is the SOURCE's
  # unit (millions) and `intervention_capacity`'s contract is billions, so
  # `reserves_client.fetch_reserves` performs the conversion and both units are
  # named on the disclosure it returns.
  #
  # `not_a_snapshot_field: true` on all three: `reserves_client` selects them by
  # COUNTRY, and the snapshot builder's one-field-one-series model does not shape
  # a per-country lookup. They are registered so the source is auditable
  # (Section 21.1's actual purpose), not so the builder fetches them.
  # -------------------------------------------------------------------------
  fx_reserves_japan:
    provider: fred
    symbol: TRESEGJPM052N
    not_a_snapshot_field: true
    description: >
