  # ------------------------------------------------ Module 3.4 BLOCKED inputs
  # Both of Module 3.4's credit-growth inputs are in the `blocked:` list at the
  # foot of this file, where Section 21.4's Loophole Ledger keeps them. They have
  # no `series` entries: FRED's total bank credit, total loans and C&I loans are
