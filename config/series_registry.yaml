  durable_goods_orders:
    provider: fred
    symbol: DGORDER
    not_a_snapshot_field: true
    description: >
      Manufacturers' New Orders, durable goods, SA, millions of dollars.
      Module 7.5's investment proxy. NOMINAL, same basis caveat as
      retail_sales. Note this is NEW ORDERS — a forward-looking intent measure
      — being used as a stand-in for realised investment, and its
      month-over-month change is 3-4x more volatile than retail sales'.
      Probed 2026-09-17: 414 monthly observations, 1992-02..2026-07.
    frequency: monthly
    units: millions_usd
    status: verified
    verified_on: 2026-09-17
    verified_value: 339392.0
    verified_observation_date: 2026-07-01
    plausible_range: [50000.0, 1000000.0]

  trade_balance:
    provider: fred
    symbol: BOPGSTB
    not_a_snapshot_field: true
    description: >
      Trade Balance, goods and services, SA, millions of dollars. Module 7.5's
      net-exports input. NEGATIVE in 100% of its observations — it is the US
      goods-and-services DEFICIT (min -132983, max -831 over 415 observations,
      1992-01..2026-07).

      This sign is load-bearing and is why the entry exists in the registry
      rather than only in the model. Section 6.5 takes a PERCENT CHANGE of this
      series and multiplies it by a POSITIVE weight. For an all-negative series
      v = -|v| the percent change is

          pct = v[t] / v[t-1] - 1 = |v[t]| / |v[t-1]| - 1

      (the two minus signs cancel), so pct is the percent change of the
      ABSOLUTE VALUE. |v| grows exactly when the deficit WIDENS, which is
      contractionary, so pct > 0 is contractionary and a contractionary event
      must LOWER the nowcast. The weight must therefore be NEGATIVE.

      Under the specification's +0.1 both directions are inverted: a widening
      deficit (contractionary) raises the nowcast, and a narrowing one lowers
      it. Measured over 414 months the term was wrong on 414/414 -- deficit
      widened 227 (54.8%), narrowed 187 (45.2%) -- so this is structural, not
      intermittent. Module 7.5 applies a NEGATIVE net-exports weight.
      See D-034.

      Also unbounded by construction: a percent change of a series that crossed
      zero would explode, and this one comes within 0.6% of doing so.
    frequency: monthly
    units: millions_usd
    status: verified
    verified_on: 2026-09-17
    verified_value: -88576.0
    verified_observation_date: 2026-07-01
    plausible_range: [-500000.0, 0.0]

  gdpnow_published:
    provider: fred
    symbol: GDPNOW
    not_a_snapshot_field: true
    description: >
      Atlanta Fed GDPNow estimate. Section 6.5's docstring states there is "no
      free API" for this figure and prescribes manual entry. That is FALSE on
      this build: FRED serves it, so the manual route is unnecessary and the
