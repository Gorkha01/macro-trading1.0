  # ---------------------------------------------------------------------------
  # Euro area (country code "eu") — Section 22.3's second multi-country
  # increment. European Central Bank.
  #
  # The `eu_` prefix is load-bearing for the same reason `gb_` is: the registry
  # is a FLAT namespace, so an unprefixed name would collide with a US or UK
  # series and silently serve another country's data to a euro thesis.
  #
  # WHY THIS BLOCK LOOKS DIFFERENT FROM `gb_`. The euro area is not a country
  # with a national statistics office; it is a CURRENCY UNION of 20 states. Two
  # consequences are visible in the provenance recorded below and are NOT
  # incidental:
  #
  #   1. **No single route serves every leg.** The ECB's own policy rates are on
  #      FRED; HICP is on FRED (as an index) and on the OECD route (as a rate);
  #      unemployment is on `econdb` ONLY. Measured 2026-10-10: every FRED
  #      euro-area unemployment variant stops in <=2023 (`LRHUTTTTEZM156S` ->
  #      2023-01, `LRHUTTTTEZQ156S` -> 2022-10) while Germany's equivalent
  #      (`LRHUTTTTDEM156S`) is current — so the gap is real, not a bad symbol.
  #      Two entries below therefore carry `extra_params`, the route-parameter
  #      surface added with this increment.
  #   2. **The same quantity arrives at two different SCALES on two routes.**
  #      The OECD HICP rate is a FRACTION (0.019 = 1.9%) and econdb's euro 10y
  #      is a FRACTION (0.03748 = 3.748%), while every FRED rate is a PERCENT.
  #      Both were measured, not assumed. Each entry declares its `units` and
  #      `source_units` so the fetcher CONVERTS rather than a reader guessing.
  #
  # Section 22.3's warning applies to this block as much as to `gb_`: these are
  # the DATA leg only. A euro reaction function that is a relabelled Fed Taylor
  # rule is explicitly rejected by the spec — see `models/policy_rules.py`'s
  # `ecb_*` rules, which encode a currency union's structure rather than
  # substituting HICP into a single-country rule.
  # ---------------------------------------------------------------------------

