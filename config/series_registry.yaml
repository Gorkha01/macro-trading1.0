# config/series_registry.yaml
#
# AGENTS.md Section 5.2 + Section 21.1.
#
# Every LIVE input in the system resolves through this file. One entry = one
# internal field name -> exactly one provider route. Keeping the mapping in
# config (not code) is what lets a source be re-pointed after a Phase 0
# verification without touching the models layer.
#
# ENTRY STATUS VALUES
#   verified  — route confirmed to return data in Phase 0 (see docs/SERIES_VERIFICATION.md)
#   unverified— route documented in the spec but NOT yet confirmed; a fetch attempt
#               against an unverified route raises rather than silently returning empty
#   blocked   — no reachable source exists; the consuming function raises
#               NotImplementedError and the item appears in docs/OPEN_ISSUES.md
#
# Section 21.0 rule 3: "No input may be invented. If an input's source is not
# defined in Section 21.1, the agent MUST stop and ask, not assume."

version: 1

# Default provider route. OpenBB's FRED provider is the workhorse for this
# system: it exposes the full FRED catalog behind one consistent interface.
defaults:
  provider: fred
  endpoint: economy.fred_series
  frequency_note: >
    FRED series carry their own native frequency. The data layer does NOT
    resample or forward-fill: a monthly series stays monthly. Resampling to a
    common frequency is a modelling decision that belongs in the models layer,
    where it is explicit and testable.

series:
  # ---------------------------------------------------------------- Module 7
  gdp_real:
    provider: fred
    symbol: GDPC1
    description: Real Gross Domestic Product, chained 2017 dollars, SAAR, billions
    frequency: quarterly
    units: billions_chained_2017_usd
    status: verified
    verified_on: 2026-09-16
    verified_value: 24269.613
    plausible_range: [1000.0, 100000.0]
    # ALFRED revisions retrievable. Verified 2026-09-22 against the live FRED
    # API: `series/vintagedates?series_id=GDP` reports 414 vintage dates back to
    # 1991-12-04, and 2013Q1 was published as 16535.3 against 16648.189 today —
    # a $113B revision on one quarter, which is exactly the magnitude that makes
    # a replay against today's values a look-ahead error.
    vintage_eligible: true

  gdp_nominal:
    provider: fred
    symbol: GDP
    description: Gross Domestic Product, SAAR, billions
    frequency: quarterly
    units: billions_usd
    status: verified
    verified_on: 2026-09-16
    verified_value: 32486.066
    plausible_range: [1000.0, 100000.0]

  # Module 7.1's income-side counterpart to gdp_nominal. Section 21.1's
  # data-source table marks this as "BEA GDI (VERIFY series)", and Section
  # 21.0 rule 5 forbids building against an unverified route, so the symbol
  # was probed live before this entry was written. FRED `GDI` returns 318
  # quarterly observations, 1947-01..2026-04, fully populated. The two
  # candidate alternatives are DEAD and were rejected by probe:
  # `GDINC1` (real GDI) and `A261RC1Q027SBEA` both return empty frames, so
  # neither may be used as a substitute.
  #
  # Note the deliberate asymmetry with gdp_nominal: `GDP` and `GDI` are both
  # NOMINAL here. Pairing a nominal series with a real one would make the
  # discrepancy measure a deflator wedge rather than a statistical one.
  gdi:
    provider: fred
    symbol: GDI
    description: >-
      Gross Domestic Income, SAAR, billions. The income-side measure of the
      same aggregate GDP measures from the expenditure side. The two are
      equal in theory and differ in practice by a statistical discrepancy
      that is a residual, so its SIGN is not informative (measured 47.8%
      GDP-led vs 52.2% GDI-led on year-over-year growth).
    frequency: quarterly
    units: billions_usd
    status: verified
    verified_on: 2026-09-17
    verified_value: 32245.142
    plausible_range: [1000.0, 100000.0]
    decision_note: >-
      D-031. Selected after live probing; the sibling routes GDINC1 and
      A261RC1Q027SBEA are absent from FRED and return empty frames.

  gdp_potential:
    provider: fred
    symbol: GDPPOT
    forward_looking: true
    description: >
      Real Potential Gross Domestic Product (CBO). Section 21.1 directs using
      this directly rather than computing Cobb-Douglas, logging the choice in
      docs/DECISIONS.md. NOTE: CBO publishes forward projections here (~10
      years ahead of the current quarter), so this series is explicitly
      `forward_looking`. Consumers must filter to observation_date <= as_of
      before using any value as realised capacity; the forward points are the
      basis for the *expected* output gap, not the current one.
    frequency: quarterly
    units: billions_chained_2017_usd
    seasonality: >
      NOT SEASONALLY ADJUSTED, per FRED's series page (verified 2026-09-16).
      Its sibling gdp_real (GDPC1) is seasonally adjusted at an annual rate.
      The two are published on the same chained-dollar basis so the ratio is
      usable, but a seasonally unadjusted *potential* series has no seasonal
      component to remove — potential output is a counterfactual, not a
      measurement. The mismatch is a recorded limitation (DECISIONS.md D-009),
      not a correction to apply. Empirical check: the output gap shows no
      systematic quarterly pattern (Q1 +0.96, Q2 +0.95, Q3 +1.21, Q4 +1.37 over
      20 quarters), so the difference is second-order here — but it is why a
      consumer must not assume the two series are adjusted identically.
    decision_note: >
      PUBLICATION CADENCE (DECISIONS.md D-009). GDPPOT runs ONE QUARTER AHEAD
      of GDPC1: on 2026-09-16 the latest realised potential estimate was
      Q3 2026 while the latest actual GDP print was Q2 2026. A consumer that
      takes each series' own latest point subtracts Q2 output from Q3 capacity
      and measures a quarter of growth rather than slack — the live defect that
      produced +0.29% instead of +0.83%. Consumers must pair on the latest
      COMMON observation date.
    status: verified
    verified_on: 2026-09-16
    verified_value: 24070.9386484
    verified_observation_date: 2026-04-01
    verified_curve:
      latest_realised_observation: 2026-07-01
      latest_realised_value: 24200.4446936
      projection_block_starts: 2026-10-01
      projection_horizon_end: 2036-10-01
      observation_count: 62
      forward_dated_count: 41
    plausible_range: [1000.0, 40000.0]

  # ---------------------------------------------------------------- Module 5
  cpi_headline:
    provider: fred
    symbol: CPIAUCSL
    description: Consumer Price Index for All Urban Consumers, All Items, SA
    frequency: monthly
    units: index_1982_1984_100
    status: verified
    verified_on: 2026-09-16
    verified_value: 334.13
    plausible_range: [50.0, 1000.0]
    # ALFRED revisions retrievable. Verified 2026-09-22 against the live FRED
    # API: 669 vintage dates back to 1972-07-21; observations 2024-01..03 read
    # 309.685/311.054/312.230 at vintage 2024-06-01 against 309.698/310.967/
    # 312.345 now, so real revision history exists and is retrievable.
    vintage_eligible: true

  cpi_core:
    provider: fred
    symbol: CPILFESL
    description: CPI All Items Less Food and Energy, SA
    frequency: monthly
    units: index_1982_1984_100
    status: verified
    verified_on: 2026-09-16
    verified_value: 337.765
    plausible_range: [50.0, 1000.0]

  pce_core:
    provider: fred
    symbol: PCEPILFE
    description: PCE Price Index Excluding Food and Energy
    frequency: monthly
    units: index_2017_100
    status: verified
    verified_on: 2026-09-16
    verified_value: 130.658
    plausible_range: [50.0, 500.0]

  # Module 5.3's two dispersion measures. Section 21.1 marked BOTH blocked
  # ("BLOCKED -> MANUAL"); both are live FRED series and were found by
  # `fred_search` in a single query each. This is the O-21 defect class for the
  # THIRD time (D-043, D-047, and now), and it is the occurrence with the
  # largest measurable consequence: with the block trusted, the convergence
  # classifier runs at THREE measures, where `high_threshold = 0.8` is a
  # unanimity rule in disguise and MEDIUM is reachable at exactly one value.
  # So the false block was not merely hiding two series -- it was hiding a
  # threshold degeneracy, and the degeneracy would have shipped unnoticed
  # because three is a perfectly plausible input set. See D-047.
  #
  # `median_cpi_direction` and `trimmed_mean_direction` are named for the
  # DIRECTION (the sign) each contributes, not for the level. The classifier
  # consumes signs only, so neither entry publishes a meaningful
  # `verified_value`; what is verified is the ROUTE, the window, and the units.
  median_cpi_direction:
    provider: fred
    symbol: MEDCPIM157SFRBCLE
    not_a_snapshot_field: true
    description: >
      Cleveland Fed 16% Trimmed-Mean CPI Inflation Rate (month-over-month).
      NOT a MacroDataSnapshot field: Module 5.3 consumes only the SIGN of this
      measure, and the classifier's own live check fetches it directly rather
      than reading it out of a snapshot.
    frequency: monthly
    units: percent_change_mom
    status: verified
    verified_on: 2026-09-17
    verified_value: 0.1737
    verified_observation_date: 2026-08-01
    plausible_range: [-5.0, 5.0]
    decision_note: >
      PROBED LIVE 2026-09-17: 524 observations, 1983-01 .. 2026-08. The series
      begins 1983-01, which is the binding constraint on the classifier's
      common window -- shorter than `PCETRIM1M158SFRBDAL`'s 1977-02 start, so
      524 months is the sample the live check runs over, not 594.

      TAGGED `BLS_CPI`, NOT `DALLAS_FED`, even though the Cleveland Fed
      computes it. The median is derived from the BLS CPI microdata: a BLS
      survey redesign corrupts it at the same moment it corrupts headline CPI,
      which is the definition of a shared evidence family. Tagging it as its
      own family would overstate independence and inflate every confidence
      this function publishes. A reviewer could reasonably assign it
      otherwise; that is why the assignment is recorded here rather than left
      implicit in the code (D-047).

  trimmed_mean_direction:
    provider: fred
    symbol: PCETRIM1M158SFRBDAL
    not_a_snapshot_field: true
    description: >
      Dallas Fed Trimmed Mean PCE Inflation Rate (percent change at an annual
      rate). NOT a MacroDataSnapshot field: Module 5.3 consumes only the SIGN
      of this measure, and the classifier's own live check fetches it directly
      rather than reading it out of a snapshot.
    frequency: monthly
    units: percent_change_annualized
    status: verified
    verified_on: 2026-09-17
    verified_value: 2.2
    verified_observation_date: 2026-07-01
    plausible_range: [-10.0, 20.0]
    decision_note: >
      PROBED LIVE 2026-09-17: 594 observations, 1977-02 .. 2026-07.

      **UNITS TRAP, and it is silent.** This series is a percent change at an
      ANNUAL rate; every other input to the classifier is a month-over-month
      change. The same month is therefore roughly TWELVE TIMES larger here than
      its siblings, in a model whose six inputs otherwise look symmetric. The
      classifier consumes only each measure's SIGN, so the scale cancels and
      the current verdict is unaffected -- but a caller that later adds
      magnitude handling has a factor-of-twelve hazard sitting in one of six
      inputs, and nothing in the arithmetic would flag it. The unit is declared
      above so the trap is visible at the point of consumption rather than only
      in the model's docstring.

      **DISTINCT EVIDENCE FAMILY FROM THE CPI MEASURES.** Unlike the median
      above, this is tagged `DALLAS_FED`: it is a *PCE* measure computed from
      BEA microdata by a different institution, so it is independent of a BLS
      CPI survey problem. That independence is the entire reason the
      classifier's family count reaches 3 rather than being capped at 2.

  ppi:
    provider: fred
    symbol: PPIFIS
    description: PPI Final Demand, SA
    frequency: monthly
    units: index_nov_2009_100
    status: verified
    verified_on: 2026-09-16
    verified_value: 157.411
    plausible_range: [50.0, 500.0]
    decision_note: >
      Module 5.4's FINAL-DEMAND stage. Begins 2009-11, which bounds the common
      window for any three-stage comparison: WPSID61/WPSID62 reach back to 1947
      but this series does not, so the usable history for the pipeline signal is
      202 months, not 953. That 751-month difference is why the gradient's base
      rate is measured over 2010-11 .. 2026-08 and not the full WPSID history.

  # Module 5.4's stage-of-processing pipeline. The specification names three
  # stages and no symbols; these are this build's mapping (see D-029). Note the
  # base-year difference: WPSID* are 1982=100, PPIFIS is Nov 2009=100. That is
  # immaterial for the pipeline signal because every input is a year-over-year
  # percent change of a series against ITSELF, where the base cancels -- but it
  # forbids comparing the levels across stages, which is why they never are.
  #
  # PPICRM ("crude materials for further processing") is deliberately NOT used:
  # it was DISCONTINUED by BLS after 2015-12 with the 2017 PPI reclassification
  # and would silently truncate every crude-stage reading by a decade. WPSID62 is
  # the live crude-stage equivalent.
  ppi_stage_crude:
    provider: fred
    symbol: WPSID62
    description: PPI by Commodity, Intermediate Demand by Commodity Type, Unprocessed Goods
    frequency: monthly
    units: index_1982_100
    status: verified
    verified_on: 2026-09-17
    verified_value: 280.001
    plausible_range: [10.0, 2000.0]
    decision_note: >
      The crude stage for Module 5.4. "Unprocessed goods for intermediate
      demand" is the closest live series to the crude stage; the explicit crude
      index is discontinued. More volatile than the other two stages by
      construction, which is part of why the three-way ordering is noisy -- see
      the base-rate warning in ppi_pipeline_signal.

  ppi_stage_intermediate:
    provider: fred
    symbol: WPSID61
    description: PPI by Commodity, Intermediate Demand by Commodity Type, Processed Goods
    frequency: monthly
    units: index_1982_100
    status: verified
    verified_on: 2026-09-17
    verified_value: 291.93
    plausible_range: [10.0, 2000.0]
    decision_note: >
      The intermediate stage for Module 5.4. Conceptually the least ambiguous of
      the three stages: "processed goods for intermediate demand" is precisely
      what the intermediate stage means.

  # ---------------------------------------------------------------- Module 6
  unemployment_rate:
    provider: fred
    symbol: UNRATE
    description: Civilian Unemployment Rate, SA
    frequency: monthly
    units: percent
    status: verified
    verified_on: 2026-09-16
    verified_value: 4.1
    plausible_range: [0.0, 25.0]

  initial_claims:
    provider: fred
    symbol: ICSA
    description: Initial Claims for Unemployment Insurance, SA, weekly
    frequency: weekly
    units: persons
    status: verified
    verified_on: 2026-09-16
    verified_value: 206000.0
    plausible_range: [50000.0, 10000000.0]

  continuing_claims:
    provider: fred
    symbol: CCSA
    description: Continuing Claims for Unemployment Insurance, SA, weekly
    frequency: weekly
    units: persons
    status: verified
    verified_on: 2026-09-16
    verified_value: 1774000.0
    plausible_range: [500000.0, 30000000.0]

  jolts_openings:
    provider: fred
    symbol: JTSJOL
    description: Job Openings — Total Nonfarm, SA
    frequency: monthly
    units: thousands
    status: verified
    verified_on: 2026-09-16
    verified_value: 7271.0
    plausible_range: [1000.0, 20000.0]

  jolts_quits:
    provider: fred
    symbol: JTSQUR
    description: Quits Rate — Total Nonfarm, SA
    frequency: monthly
    units: percent
    status: verified
    verified_on: 2026-09-16
    verified_value: 1.9
    plausible_range: [0.5, 10.0]

  # ---------------------------------------------------------- Modules 2, 4, 8
  fed_funds_rate:
    provider: fred
    symbol: FEDFUNDS
    description: >
      Effective Federal Funds Rate, monthly average. Kept on `fred_series`
      (D-086): the dedicated `fixedincome/rate/effr` command returns the
      DAILY effective rate, which is a different series from this MONTHLY
      average, not a substitute for it. Measured 2026-09-21 — `FEDFUNDS` over
      a September-only window returns 0 rows (monthly), `effr` returns 12
      (daily). Substituting one for the other would silently change the
      series' frequency and every MoM comparison built on it.
      The dedicated command's `target_range_upper`/`lower` typed fields are
      recorded as available for a Phase 5+ consumer; adopting them means
      adding a new field, not re-pointing this one.
    frequency: monthly
    units: percent
    status: verified
    verified_on: 2026-09-16
    verified_value: 3.63
    plausible_range: [0.0, 25.0]

  # D-086: the DEDICATED rate commands are NOT adopted, and the reason is
  # MEASURED rather than stylistic. Two independent blockers, both verified
  # live 2026-09-21:
  #
  # 1. SCALE. `fixedincome/rate/sofr` returns `rate` as a DECIMAL (0.0385)
  #    where `economy.fred_series?symbol=SOFR` returns PERCENT (3.85) for the
  #    same observation date. The same trap does NOT apply to `iorb`, which
  #    returns 3.9 from both routes — so a bulk endpoint swap would look
  #    CORRECT on one field and introduce a silent 100x error on the next.
  #    The `source_units: decimal` declaration added in D-086 makes this
  #    survivable, so scale alone is no longer disqualifying.
  # 2. COVERAGE. `economy/survey/sloos` returns only THREE symbols —
  #    DRISCFLM, SUBLPDCLCTSNQ, DRISCFS, all about loan-rate SPREADS. The
  #    field this registry needs, DRTSCILM (net % tightening C&I lending
  #    STANDARDS), is NOT among them. That is a coverage limit, not a scale
  #    one, and no declaration fixes it.
  #
  # So the scalar FRED route stays for these fields. It is not a defect: for
  # a single named series `fred_series` is the correct command. It is the
  # wrong choice only where a dedicated command returns the SAME series more
  # cheaply — which is true of the curve (11 calls -> 1, adopted above) and
  # false of these.
  sofr:
    provider: fred
    symbol: SOFR
    future_date_tolerance_days: 1
    description: >
      Secured Overnight Financing Rate. Same same-day-publication condition as
      iorb: SOFR is published in the morning for the prior business day, so a
      tolerance of 1 covers the UTC-date boundary without arming a wider gap.
      D-086: `fixedincome/rate/sofr` is a live alternative returning percentiles
      and volume, but it serves `rate` in DECIMAL (0.0385 vs this route's 3.85);
      not adopted, per the block comment above.
    frequency: daily
    units: percent
    status: verified
    verified_on: 2026-09-16
    verified_value: 3.64
    plausible_range: [0.0, 25.0]

  iorb:
    provider: fred
    symbol: IORB
    future_date_tolerance_days: 3
    description: >
      Interest Rate on Reserve Balances. The administered rate the Fed pays on
      reserves, and the effective TOP of the post-2021 floor-system corridor.
    decision_note: >
      CORRECTED 2026-09-19 (AUDIT-002). The declaration was
      `future_date_tolerance_days: 1`, justified by "FRED publishes the current
      calendar day's print before midnight UTC". Live re-verification disproves
      that: on retrieval date 2026-09-19 the series returned observations dated
      2026-09-20 AND 2026-09-21 — TWO days ahead, so the tolerance of 1 armed
      the ERROR path against a legitimate print and produced a standing failure
      (O-84). IORB is *forward-scheduled*: the Fed publishes the administered
      rate for upcoming days in advance because it is a policy-set number, not
      a market print. A tolerance of 3 covers a weekend boundary (Fri publish
      covering Mon) with no risk of masking a genuine fault, which lands far
      outside it — a broken mapping would be weeks or years ahead. Compare
      `sofr`, whose tolerance of 1 IS correct because SOFR is a real
      prior-business-day market print; the two series differ in kind, which is
      why the tolerance is a per-series property and not a global constant.
    frequency: daily
    units: percent
    status: verified
    verified_on: 2026-09-19
    verified_value: 3.9
    plausible_range: [0.0, 25.0]

  on_rrp_rate:
    provider: fred
    symbol: RRPONTSYAWARD
    description: >
      Overnight Reverse Repurchase Agreement Offering Rate. This is the
      administered ON-RRP rate and the true lower bound of the post-2021 floor
      system corridor.
    decision_note: >
      CORRECTED 2026-09-16. Section 21.1 originally named FRED `RRPONTSYD` as
      the on_rrp_rate source. A live probe measured RRPONTSYD = 0.70 with 3326
      observations — that is the ON-RRP *volume* in USD billions, not a rate
      (a genuine policy rate could not sit 290bp below IORB). RRPONTSYAWARD
      measured 3.50%, slotting correctly between SOFR (3.64) and the lower
      bound of the corridor. Section 21.0 rule 3 forbids resolving this by
      assumption, so the rebinding was put to the user and approved. Recorded
      in docs/DECISIONS.md as D-001.
    frequency: daily
    units: percent
    status: verified
    verified_on: 2026-09-16
    verified_value: 3.50
    plausible_range: [0.0, 25.0]

  on_rrp_volume_bn:
    provider: fred
    symbol: RRPONTSYD
    description: >
      Overnight Reverse Repurchase Agreements, Treasury Securities Sold by the
      Federal Reserve — the outstanding ON-RRP *volume* in USD billions. NOT a
      rate; never to be substituted for one (Section 21.0 rule 4). Exists to
      supply the `repo_volume_change_pct` corroboration that Section 22.11
      requires before `repo_stress_check` may escalate to ACUTE_REPO_STRESS.
    decision_note: >
      Added 2026-09-16 when `on_rrp_rate` was rebound to RRPONTSYAWARD. Without
      this field, Section 22.11's mandatory volume cross-check has no source and
      the corrected repo_stress_check could not be implemented as specified.
      See docs/DECISIONS.md D-001.
    frequency: daily
    units: billions_usd
    status: verified
    verified_on: 2026-09-16
    verified_value: 0.70
    plausible_range: [0.0, 3000.0]

  # ---------------------------------------------------------------- Module 8
  credit_spread_hy:
    provider: fred
    symbol: BAMLH0A0HYM2
    description: ICE BofA US High Yield Index Option-Adjusted Spread
    decision_note: >
      `signed_series: true` — the plausible_range [0.1, 40.0] is the correct bound
      for the OAS LEVEL (verified 2026-09-19: BAMLH0A0HYM2 never negative across
      its full 795-observation live history, min 2.59 / max 4.61), but this field
      is also used to carry a spread CHANGE, and a narrowing spread is
      legitimately negative. Only the UPPER bound is enforced. See
      RegistrySeries.signed_series and AUDIT-001.
    signed_series: true
    frequency: daily
    units: percent
    status: verified
    verified_on: 2026-09-19
    verified_value: 2.7
    plausible_range: [0.1, 40.0]

  credit_spread_ig:
    provider: fred
    symbol: BAMLC0A0CM
    description: ICE BofA US Corporate Index Option-Adjusted Spread
    decision_note: >
      `signed_series: true` for the same reason as credit_spread_hy: the LEVEL
      range [0.1, 20.0] is right, but the field also carries signed changes.
      Only the UPPER bound is enforced.
    signed_series: true
    frequency: daily
    units: percent
    status: verified
    verified_on: 2026-09-19
    verified_value: 0.78
    plausible_range: [0.1, 20.0]

  equity_volatility:
    provider: fred
    symbol: VIXCLS
    not_a_snapshot_field: true
    description: >
      CBOE Volatility Index (VIX), the 30-day implied volatility of S&P 500
      options, in index points. Module 8.3's `equity_vol_change_pct` input.
      NOT a MacroDataSnapshot field: the model takes it as a raw float and
      credit_spread_attribution's own live check fetches it (Section 21.1
      names "VIX" as the source; VIXCLS is FRED's series for it).

      NOTE ON UNITS: this series is a LEVEL in index points, not a percent.
      The model's input is a PERCENT CHANGE, so the live check divides two
      levels. That is a different conversion from the two credit spreads
      directly above, which are in percent and must be multiplied by 100 to
      reach the basis points their input is denominated in. Two different
      conversions on adjacent inputs is exactly the pairing-axis hazard
      (Section 21.0; D-035), so both are asserted in the live check.
    frequency: daily
    units: index
    status: verified
    verified_on: 2026-09-17
    verified_value: 17.2
    verified_observation_date: 2026-09-15
    plausible_range: [5.0, 100.0]

  federal_deficit_pct_gdp:
    provider: fred
    symbol: FYFSGDA188S
    not_a_snapshot_field: true
    description: >
      Federal Surplus or Deficit as Percent of GDP. Module 3.2's
      `fiscal_deficit_pct_gdp`. NOT a MacroDataSnapshot field: the model takes a
      raw float and policy_mix_classifier's own live check fetches it.

      **SIGN WARNING -- this series is NEGATIVE for a deficit.** 83 of its 97
      observations are negative, and the 2020 COVID deficit reads -14.48. The
      model's field is named `fiscal_deficit_pct_gdp` and compares it against a
      trailing average to decide whether fiscal policy is LOOSE, so a caller must
      NEGATE this series before supplying it. Fed raw, a LARGER deficit is MORE
      negative, and `deficit > average` reports the most stimulative budgets in
      the sample as the tightest -- the D-034 failure mode, silent and plausible.
    frequency: annual
    units: percent_of_gdp
    status: verified
    verified_on: 2026-09-17
    verified_value: -5.7691
    verified_observation_date: 2025-01-01
    plausible_range: [-40.0, 10.0]

