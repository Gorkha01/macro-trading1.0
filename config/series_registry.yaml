      cross-path fallback): NOWCAST, GDPNOWC1, ATLGDPNOW.
    frequency: quarterly
    units: percent_annualized
    status: verified
    verified_on: 2026-09-17
    verified_value: 5.1028
    verified_observation_date: 2026-07-01
    plausible_range: [-50.0, 50.0]

  # -------------------------------------------------------------------------
  # trilemma_reserves — Section 15.20-A / D-048
  #
  # Total reserves excluding gold, IMF International Financial Statistics,
  # expressed in dollars, from FRED's `TRESEG<CC>M052N` family. These are the
  # series `check_trilemma_tension` reads to detect a losing peg defence
  # (reserves depleting while the peg holds).
  #
  # WHY THEY ARE `not_a_snapshot_field: true`: the three trilemma LEGS are
  # manual by construction (O-28) — a currency's peg status and capital-account
  # regime are institutional facts, not FRED fields — so `TrilemmaInputs` is
  # assembled by hand and no `MacroDataSnapshot` field carries these series.
  # They are registered for PROVENANCE: so that the live check's exclusion
  # counts and the dollar magnitudes are traceable to a symbol.
  #
  # THE CADENCE CAVEAT, which is the reason this comment is long. The symbol's
  # trailing `M` says monthly, and the COUNT of observations implies a long
  # monthly history — but the earliest observations are NOT monthly. Verified
  # 2026-09-17: GB and KR carry 843/842 observations of which 6 are annual
  # (pre-1956-12), and ID carries 700 of which 32 are annual-then-quarterly
  # (pre-1970-12). A model whose threshold names a calendar span must therefore
  # verify the SAMPLING CADENCE over the window and disclose what it excluded;
  # it must not read the observation count as a measurement window.
  # `check_trilemma_tension` excludes the non-monthly prefix and reports the
  # exclusion on every output.
  # -------------------------------------------------------------------------

  trilemma_reserves_gb:
    provider: fred
    symbol: TRESEGGBM052N
    not_a_snapshot_field: true
    description: >
      UK total reserves excluding gold, MILLIONS of dollars. The 1992 Black
      Wednesday episode (§18.1): the UK spent reserves defending the ERM's
      DM 2.7780 floor until 1992-09-16, when it left the mechanism and the
      pound fell. Probed 2026-09-17: 843 raw observations, beginning
      1950-12-01, ending 2026-08-01; 837 of them are monthly.

      CADENCE: the first SEVEN observations are annual — 1950-12, 1951-12, ...,
      1956-12 — and only then does the series switch to monthly (1957-01,
      1957-02, ...). The 6 pure-annual points 1950-12 .. 1955-12 are EXCLUDED;
      1956-12 is RETAINED as the first monthly observation, so the monthly span
      does not open with a 12-month hole. Result: 6 dropped, 837 monthly, of
      which 834 carry the prior 3-month history the two measures need and are
      therefore the denominator of the published base rates. The gap between
      837 and 834 is not a data defect: the measures consume two observations
      as history.

      NOT a clean monthly series for its whole length, despite the symbol's
      trailing M. See the group comment above.
    frequency: monthly
    units: millions_usd
    status: verified
    verified_on: 2026-09-17
    verified_value: 169355.6607966373
    verified_observation_date: 2026-08-01
    plausible_range: [0.0, 200000.0]

  trilemma_reserves_kr:
    provider: fred
    symbol: TRESEGKRM052N
    not_a_snapshot_field: true
    description: >
      Korea total reserves excluding gold, MILLIONS of dollars. The 1997 Asian
      crisis episode (§18.7): reserves fell from roughly $30bn in 1997-08 to
      below $10bn by 1997-12 as the won's defence failed. Probed 2026-09-17:
      842 raw observations, beginning 1950-12-01, ending 2026-07-01; 836 of
      them are monthly.

      CADENCE: the first SEVEN observations are annual — 1950-12 .. 1956-12 —
      then monthly from 1957-01. The 6 pure-annual points 1950-12 .. 1955-12
      are EXCLUDED and 1956-12 is RETAINED as the first monthly observation,
      leaving 836 monthly, of which 833 carry a full 3-month history and are
      the published base-rate denominator.

      Carries the same cadence caveat as the GB entry: the symbol says monthly
      and the count implies a long monthly history, but the prefix is not.
    frequency: monthly
    units: millions_usd
    status: verified
    verified_on: 2026-09-17
    verified_value: 421968.564846368
    verified_observation_date: 2026-07-01
    plausible_range: [0.0, 600000.0]

  trilemma_reserves_id:
    provider: fred
    symbol: TRESEGIDM052N
    not_a_snapshot_field: true
    description: >
      Indonesia total reserves excluding gold, MILLIONS of dollars. The 1997
      Asian crisis's worst case (§18.7): the rupiah's crawling band was
      abandoned in 1997-08 and reserves fell by roughly a third within months.
      Probed 2026-09-17: 700 raw observations, beginning 1950-12-01, ending
      2026-07-01; only 668 of them are monthly.

      CADENCE, and this entry is written out in full because the first
      characterisation of it was WRONG in a way that would mislead. It was
      recorded as "32 annual observations before 1970-12-01". The COUNT (32)
      was right; the COMPOSITION was not. Re-probed against the provider, the
      raw sequence is: 16 ANNUAL points 1950-12 .. 1964-12, then a CONTINUOUS
      QUARTERLY block 1965-03 .. 1968-12 (16 points, four years of Mar/Jun/Sep/
      Dec), then the monthly series from 1971-01. It is not one cadence change
      at one date, and a reader who assumed so would mis-date the usable window
      by four years.

      Exclusion convention (the count depends on it, and the GB/KR entries use
      it too): the pure-annual/quarterly points strictly before the monthly
      span are dropped, and the span's first member is RETAINED. So "32 of 700
      excluded" pairs with "668 monthly observations".

      Monthly observations: 668, of which 665 carry a full 3-month history and
      are the published base-rate denominator. This is why the cadence caveat
      is stated numerically per country on every output rather than as one
      general disclaimer.
    frequency: monthly
    units: millions_usd
    status: verified
    verified_on: 2026-09-17
    verified_value: 133983.0890807822
    verified_observation_date: 2026-07-01
    plausible_range: [0.0, 300000.0]

  # ------------------------------------------------- Module 9.2 PPP legs (D-117)
  # `ppp_implied_rate` was BLOCKED -> MANUAL in Section 21.1 on the premise
  # "OECD publishes PPP conversion factors; no clean free API." The 2026-09-27
  # re-probe (docs/PLAN_ppp_source.md) MEASURED that premise false -- D-043's
  # FALSE-BLOCK class, the third such entry in this file. The input is now
  # sourced from the World Bank REST API, the same "direct, not OpenBB" route
  # Section 21.1 already sanctions for `current_account_pct_gdp`.
  #
  # TWO entries, not one, because the estimand is a RATIO of two countries'
  # factors (both LCU per international $, so the denominator cancels). The
  # client divides rather than assuming the USD leg is 1, so a future non-USD
  # base cannot silently change the estimand.
  #
  # These are NOT `vintage_eligible`. The World Bank REST API has no
  # point-in-time selector, and its `lastupdated` field is a PUBLICATION date,
  # not a vintage handle. That was measured against all four free sources the
  # operator named (World Bank / IMF / OECD / Eurostat, PLAN_ppp_source.md §6):
  # NOT ONE implements a point-in-time selector, so the ALFRED capability
  # remains FRED-only (data_layer/alfred_client.py). Marking these
  # vintage_eligible would be a false claim of exactly the O-6 class.
  #
  # NOTE -- the COUNTRY is deliberately NOT a key on these entries, and this
  # cost a measured failure rather than being a style choice. `RegistrySeries`
  # is `extra="forbid"` (config.py:1047), so an `iso3: DEU` key here is not
  # ignored, it makes the WHOLE registry unparseable: 33 tests that merely
  # LOAD the registry failed with "Extra inputs are not permitted", while every
  # test that reads the new client passed -- a blast radius far wider than the
  # change, and invisible to the tests I had written for it.
  # The country belongs to the CLIENT CALL, not the registry: the client's
  # `fetch_ppp_implied_rate(domestic_iso3, foreign_iso3)` is the single place
  # that binds a leg to a country, and the leg identity is stated in prose
  # below. If a future increment needs it machine-readable, the fix is to
  # DECLARE a field on `RegistrySeries` first (and validate it), never to add
  # an undeclared key here. [O-141]
  ppp_conversion_factor_eur:
    provider: world_bank
    symbol: PA.NUS.PPP
    not_a_snapshot_field: true
    description: >
      PPP conversion factor, GDP, for GERMANY -- the euro-container leg of the
      EURUSD PPP-implied rate. LCU per international $. Published annually;
      36 non-null points 1990..2025, latest 0.709983 @ 2025 (published
      2026-07-13). USA is exactly 1 on every year by construction.

      WHY GERMANY, and this is a DECISION rather than a constant (PLAN_ppp_source
      .md §4 step 1). The World Bank's EMU aggregate returns 0 points -- MEASURED,
      not assumed -- so "USD per EUR at PPP" has no single official value.
      Germany is the euro area's largest economy, and it is the leg D-114's
      declared MANUAL 0.72 already matched: 0.72 is within 1.4% of DEU's 2025
      value, which is what makes the swap from a typed number to a fetched one
      a WIRING change rather than a MODEL change. The operator directed DEU.

      Not to be confused with the OECD's EU27_2020 aggregate, which IS published
      (OECD DSD_PPP@DF_PPP, measured) but covers EU27 -- including non-euro
      members -- and carries different vintage semantics. DEU is the chosen
      single-member proxy; a second source is a later increment's decision.
    frequency: annual
    units: lcu_per_international_dollar
    status: verified
    verified_on: 2026-09-27
    verified_value: 0.709983
    verified_observation_date: 2025-01-01
    plausible_range: [0.1, 5.0]

  ppp_conversion_factor_usd:
    provider: world_bank
    symbol: PA.NUS.PPP
    not_a_snapshot_field: true
    description: >
      PPP conversion factor, GDP, for the UNITED STATES -- the numeraire leg of
      the EURUSD PPP-implied rate. LCU per international $, so this is the
      definitional 1: MEASURED to be exactly 1 on every populated year, because
      the international dollar IS the US dollar.

      Carried as a real registry entry rather than folded into a constant
      (the D-109 lesson: a literal that stands for a measured quantity must come
      from the measurement, not from a convenient 1.0). The client divides by
      this leg, so a future change of numeraire is a registry edit and not a
      silent re-definition of the estimand.
    frequency: annual
    units: lcu_per_international_dollar
    status: verified
    verified_on: 2026-09-27
    verified_value: 1.0
    verified_observation_date: 2025-01-01
    plausible_range: [0.5, 2.0]

  # -------------------------------------------------------------------------
  # EM VULNERABILITY inputs for `em_vulnerability_checklist` (Section 20's
  # part B, D-119). Section 20's HEADING claims the function "needs IMF/World
  # Bank data", which under Section 21.1's default rule would make all three
  # inputs BLOCKED. MEASURED 2026-09-29, that claim is HALF FALSE: two of the
  # three are reachable from this same World Bank host and the third is a
  # GENUINE block — the first CONFIRMED one in this repository, after four
  # FALSE ones (D-043's class: ppp_implied_rate at D-115/D-117, fx_reserves at
  # D-118).
  #
  # THE THIRD INPUT IS DELIBERATELY ABSENT FROM THIS FILE. There is no
  # `usd_denominated_debt_share` entry because no per-country source exists:
  # the full World Bank indicator catalogue (20 000 entries) was scanned and
  # the only `DT.*` names matching "currency" are "... Currency and deposits
  # ...", a debt INSTRUMENT TYPE rather than a denomination — the D-116 trap
  # of a right-sounding label on the wrong concept. Registering a fabricated
  # source here would be the defect this comment exists to prevent.
  #
  # ⚠️ THE TWO UNITS DIFFER FROM THE FRED RESERVE ENTRIES ABOVE. These are
  #     current USD (absolute), not millions, so neither needs the /1000 step
  #     `reserves_client` performs. A unit is not a label (D-116): the two
  #     routes to a reserve stock must never be substituted for one another.
  #
  # All three are `not_a_snapshot_field`: the model selects them by COUNTRY and
  # the snapshot builder's one-field-one-series model does not shape a
  # per-country lookup. They are registered so the SOURCE is auditable
  # (Section 21.1's actual purpose), not so the builder fetches them.
  # -------------------------------------------------------------------------
  current_account_pct_gdp_world_bank:
    provider: world_bank
    symbol: BN.CAB.XOKA.GD.ZS
    not_a_snapshot_field: true
    description: >
      Current account balance, PER CENT of GDP, annual, World Bank. Negative =
      deficit. The first of `em_vulnerability_checklist`'s two reachable legs;
      Section 21.1 already lists `current_account_pct_gdp` as LIVE on this
      "direct, not OpenBB" route.

      ⚠️ THE UNIT IS PER CENT, NOT A FRACTION, and that is the defect this
      entry prevents: Section 20's reference implementation compares against
      -0.03, a fraction, which against this series would fire only for deficits
      deeper than 0.03% of GDP. Measured TUR: 2024 = -0.77, 2023 = -3.63,
      2022 = -5.00 — so the conventional -3% benchmark is reached, and a
      fraction comparison would not have been.

      No point-in-time selector exists (the World Bank offers none), so this is
      a DISCLOSED VINTAGE, not a live price.
    frequency: annual
    units: percent_of_gdp
    status: verified
    verified_on: 2026-09-29
    verified_value: -0.77
    verified_observation_date: 2024-01-01
    plausible_range: [-30.0, 30.0]

  reserves_total_usd_world_bank:
    provider: world_bank
    symbol: FI.RES.TOTL.CD
    not_a_snapshot_field: true
    description: >
      Total reserves including gold, CURRENT US$ (absolute, not millions),
      annual, World Bank. The NUMERATOR of `em_vulnerability_checklist`'s
      DERIVED coverage ratio.

      ⚠️ DO NOT CONFUSE WITH `fx_reserves_japan` AND SIBLINGS ABOVE, which are
      FRED monthly series in MILLIONS of USD. These are absolute current USD on
      an ANNUAL frequency. Same concept, different unit and different
      frequency; substituting one for the other is a 1000x error that produces
      a plausible-looking reserve stock at either scale (D-116 — a unit is not
      a label).

      Measured TUR 2024 = 155548682878.169; the ratio to the ST-debt leg below
      is 0.873, a FAILING coverage check.
    frequency: annual
    units: current_usd
    status: verified
    verified_on: 2026-09-29
    verified_value: 155548682878.169
    verified_observation_date: 2024-01-01
    plausible_range: [1.0e8, 1.0e13]

  short_term_external_debt_usd:
    provider: world_bank
    symbol: DT.DOD.DSTC.CD
    not_a_snapshot_field: true
    description: >
      Short-term external debt, CURRENT US$, annual, World Bank
      (`DT.DOD.DSTC.CD`). The DENOMINATOR of `em_vulnerability_checklist`'s
      DERIVED coverage ratio. Section 21.1 calls that input "IMF reserves /
      World Bank ST external debt" and marks it DERIVED — meaning the division
      is PERFORMED by the client, never assumed (D-109).

      ⚠️ ORIGINAL maturity, NOT residual. The World Bank's own `sourceNote`
      defines `DT.DOD.DSTC.CD` as "debt that has an original maturity of one
      year or less", and no residual-maturity series exists in its catalogue
      (measured 2026-10-05). The conventional Guidotti-Greenspan coverage check
      divides by the RESIDUAL-maturity stock, which is larger, so this ratio is
      more forgiving than that convention. The basis is named on the ratio's own
      disclosure string rather than hidden; no substitute series is invented.

      Both legs are current USD, so the ratio is a pure number and NO unit
      conversion happens. That is a property of these two specific indicators,
      not a general rule, which is why `reserves_to_short_term_debt` names both
      legs' units on the disclosure it returns.

      Measured TUR 2024 = 178133840000.0.
    frequency: annual
    units: current_usd
    status: verified
    verified_on: 2026-09-29
    verified_value: 178133840000.0
    verified_observation_date: 2024-01-01
    plausible_range: [1.0e7, 1.0e13]

  # -------------------------------------------------------------------------
  # OIL BALANCE inputs for `oil_balance_signal` (Section 6.8, D-120). Section
  # 6.8's reference implementation declares `inventory_change_weekly` and
  # `opec_spare_capacity_proxy` with NO source, so under Section 21.1's default
  # rule ("any input not listed above is BLOCKED by default") both would read as
  # BLOCKED. MEASURED 2026-09-29, that reading is FALSE — this is the FIFTH
  # FALSE BLOCK this repository has caught (D-043's class, after
  # `ppp_implied_rate` at D-115/D-117, `fx_reserves` at D-118 and the two
  # EM-vulnerability legs at D-119).
  #
  # ⚠️ BOTH ARE `commodity.*` ROUTES, NOT `fred_series`, AND THEY ARE THE FIRST
  #     TWO NEW OpenBB COMMANDS THE ENGINE HAS EVER ADDED (the command census in
  #     tests/test_openbb_command_inventory.py moves 4 -> 6 in this same change).
  #     The `provider` is `eia`, not `fred`.
  #
  # ⚠️ NEITHER IS A SNAPSHOT FIELD. `oil_balance_signal` fetches them through
  #     its own live check (commodities_client) and they populate no
  #     MacroDataSnapshot field, so `not_a_snapshot_field: true` on both — the
  #     same "models' input provenance, not a snapshot field" intent the Module
  #     7.3 leading indicators carry.
  # -------------------------------------------------------------------------
  crude_inventory_weekly:
    provider: eia
    endpoint: commodity.petroleum_status_report
    symbol: WCESTUS1
    not_a_snapshot_field: true
    description: >
      Weekly U.S. ending stocks of crude oil EXCLUDING the Strategic Petroleum
      Reserve, Thousand Barrels, weekly (EIA Weekly Petroleum Status Report,
      balance-sheet `stocks` table). Reached via category=balance_sheet &
      table=stocks; the symbol is selected BY NAME from a response that carries
      19 symbols at once (measured 2026-09-29, 34 428 rows over 2 295 dates back
      to 1982-08-20).

      ⚠️ DO NOT CONFUSE WITH `WCRSTUS1` (ending stocks INCLUDING the SPR), which
      shares the same table. Section 6.8's "inventory" is the commercial stock
      that reflects supply/demand, so the SPR-inclusive series is the wrong one;
      `commodities_client` filters on `symbol == WCESTUS1` explicitly rather than
      taking a row by position.

      Section 6.8 declares its input as a DEVIATION from the 5-year seasonal
      average, so the client computes `level - mean(same ISO week over the prior
      5 years)`; this entry's `verified_value` is the raw LEVEL the deviation is
      computed from.

      The `stocks` table accepts `start_date` and honours it (measured: a narrow
      window cut 34 428 rows to 57).

      Measured latest observation 2026-09-18 = 426 398 (prior week 423 429, a
      +2 969 build).
    frequency: weekly
    units: thousand_barrels
    status: verified
    verified_on: 2026-09-29
    verified_value: 426398.0
    verified_observation_date: 2026-09-18
    plausible_range: [100000.0, 600000.0]

  opec_spare_capacity:
    provider: eia
    endpoint: commodity.short_term_energy_outlook
    symbol: COPS_OPEC
    not_a_snapshot_field: true
    forward_looking: true
    description: >
      OPEC Total Spare Crude Oil Production Capacity, MILLION BARRELS PER DAY,
      monthly (EIA Short-Term Energy Outlook, table 03d "World Crude Oil
      Production"). Reached via table=03d & symbol=COPS_OPEC; this route DOES
      honour the `symbol` parameter server-side (measured: the unfiltered table
      returns 35 symbols / 13 748 rows, the filtered call returns the 420
      COPS_OPEC rows alone).

      ⚠️ THE SERIES CARRIES A PROJECTION TAIL AND IT MUST NOT BE USED.
      `forward_looking: true` is declared because the STEO legitimately publishes
      FORECASTS: measured 2026-09-29 the series runs to 2027-12-01, and the 15
      values from 2026-10-01 onward are projections, not observations. A
      "latest value" fetch that took the last row would report a forecast as a
      measurement — the D-116 vintage trap (the IMF PPPEX case).
      `commodities_client.fetch_opec_spare_capacity` clips to observations at or
      before the as-of date and COUNTS the rows it dropped, so the disclosure
      states how much of the tail was projection.

      ⚠️ `COPS_OPEC_R05` ("OPEC Middle East Surplus ...") and `COPS_OPEC_ROT`
      ("OPEC Other Spare ...") are the Middle-East and Other COMPONENTS of this
      total, not substitutes. Measured 2027-12-01: _R05 = 2.35 and _ROT = 0.03
      sum to the COPS_OPEC total (2.38), which is how the split was identified
      rather than assumed. Section 6.8 says "OPEC spare capacity", so the TOTAL
      is the correct series.

      Section 6.8's field name calls this a "proxy" and marks it "informational
      only". The measured series is the ACTUAL spare capacity, so "proxy"
      under-claims; the field keeps the specification's name but the model
      labels it as the measured series it is.

      Measured latest OBSERVATION (<= 2026-09-29) 2026-09-01 = 0.02 mb/d.
    frequency: monthly
    units: million_barrels_per_day
    status: verified
    verified_on: 2026-09-29
    verified_value: 0.02
    verified_observation_date: 2026-09-01
    verified_curve: {observation_block_ends: 2026-09-01, projection_block_ends: 2027-12-01}
    plausible_range: [-1.0, 15.0]

  # -------------------------------------------------------------------------
  # GOLD DRIVERS for `gold_driver_attribution` (Appendix D, Module 10.2, D-121).
  # Appendix D's `GoldDriverInputs` declares three fields with NO source, so
  # under Section 21.1's default rule all three would read as BLOCKED.
  # MEASURED 2026-09-27, the answer is a MIX — and it is the first increment
  # where that is the honest reading rather than "all live" (D-120) or "one
  # CONFIRMED block" (D-119):
  #
  #   real_yield_change_bp             LIVE   — FRED `DFII10`
  #   crisis_indicator                 LIVE   — FRED `VIXCLS`
  #   central_bank_net_purchases_trend BLOCKED — MEASURED and CONFIRMED
  #
  # ⚠️ THE TWO LIVE LEGS SHARE ONE PROVIDER — FRED. Two fetches, ONE independent
  #     source family, so `gold_driver_attribution`'s confidence uses a source
  #     independence count of 1, NOT 2. Counting legs where the model means
  #     SOURCES would overstate the evidence, which is the double-counting class
  #     Section 22.8 exists to prevent.
  #
  # ⚠️ NEITHER IS A SNAPSHOT FIELD, and neither is `fred_series`-shaped like the
  #     reserves entries above — they are the same `economy.fred_series` route,
  #     but selected by the model's own client rather than the snapshot builder,
  #     so `not_a_snapshot_field: true` on both.
  # -------------------------------------------------------------------------
  gold_real_yield_10y:
    provider: fred
    endpoint: economy.fred_series
    symbol: DFII10
    not_a_snapshot_field: true
    signed_series: true
    description: >
      Market Yield on U.S. Treasury Securities at 10-Year Constant Maturity,
      Quoted on an Investment Basis, Inflation-Indexed — the 10-Year TIPS real
      yield, in PER CENT, daily (FRED `DFII10`). This is Appendix D's
      `real_yield_change_bp` source: the PRIMARY layer of the gold three-layer
      framework.

      ⚠️ THE SERIES IS A LEVEL; APPENDIX D'S INPUT IS A CHANGE. The client
      (`commodities_client.fetch_real_yield`) returns the two most recent
      observations and `real_yield_change_bp()` differences them, converting
      per-cent levels to BASIS POINTS by the named constant
      `BASIS_POINTS_PER_PERCENT` — a visible conversion, not an inlined 100
      (the D-118 dead-constant lesson).

      `signed_series: true` because the change is signed and its SIGN is the
      whole content of the primary layer: a rise in real yields is a headwind
      for gold, a fall a tailwind. The model compares `abs(change)` to the
      config materiality threshold, so both directions fire the layer.

      Measured 2026-09-27: 5 937 observations; latest 2026-09-24 = 2.85, prior
      2026-09-23 = 2.76 ⇒ a +9.0 bp change (INSIDE the 10 bp threshold).
    frequency: daily
    units: percent
    status: verified
    verified_on: 2026-09-27
    verified_value: 2.85
    verified_observation_date: 2026-09-24
    plausible_range: [-5.0, 15.0]

  gold_crisis_vix:
    provider: fred
    endpoint: economy.fred_series
    symbol: VIXCLS
    not_a_snapshot_field: true
    description: >
      CBOE Volatility Index (VIX), a LEVEL in INDEX POINTS, daily (FRED
      `VIXCLS`). This is the raw material for Appendix D's `crisis_indicator` —
      the ACUTE layer of the gold three-layer framework.

      ⚠️ THE SERIES IS A LEVEL; THE FRAMEWORK CONSUMES A BOOLEAN. The threshold
      that turns the level into `crisis_indicator` lives in config
      (`gold_driver.crisis_vix_spike_level` = 30.0), NOT here and NOT in the
      fetch — so the number that makes the acute layer fire is discoverable.
      A non-positive threshold would make the flag permanently True, which the
      settings validator refuses.

      ⚠️ THIS IS ONLY THE VIX LEG. Appendix D glosses the layer as "VIX spike /
      credit blowout / confidence event" — a compound notion this build
      measures through ONE series. A credit blowout with a calm VIX would not
      fire the layer, and the model's assumptions say so rather than implying
      the layer covers all three.

      Measured 2026-09-27: 9 279 observations; latest 2026-09-22 = 14.21 —
      BELOW the 30 threshold, so the acute layer does not fire in the current
      calm market.
    frequency: daily
    units: index_points
    status: verified
    verified_on: 2026-09-27
    verified_value: 14.21
    verified_observation_date: 2026-09-22
    plausible_range: [5.0, 90.0]

