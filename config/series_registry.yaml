      rounding to three decimals. Deriving a rate from an index is a MODELLING
      step and therefore lives in the models layer, not here — the registry's job
      is to name a real series, and this is one.
    frequency: monthly
    units: index_2015_100
    status: verified
    verified_on: 2026-10-10
    verified_value: 103.66
    verified_observation_date: 2026-08-01
    plausible_range: [50.0, 200.0]

