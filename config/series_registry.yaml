# ---------------------------------------------------------------------------
# release_calendar — Section 6 point-in-time provenance
# ---------------------------------------------------------------------------
#
# CORRECTED 2026-09-20 (audit continuation). The previous finding, recorded in
# `ObservationPoint`'s docstring and in the 2026-09-19 report, was that release
# dates are unreachable from this installation. That was HALF RIGHT and the
# wrong half mattered:
#
#   CONFIRMED: `economy.calendar` with provider=fred raises TimeoutError
#              consistently (many retries, not a transient limit), and
#              `economy.fred_release_table` returns a table of contents with no
#              date field at all.
#
#   MISSED:    `economy.calendar` accepts FOUR providers. Only `fred` was tried.
#              `fmp` and `tradingeconomics` fail on MISSING CREDENTIALS (a
#              config gap, not a dead end). **`nasdaq` works** and returns dated
#              US releases — including the CPI, PCE and PPI prints this system
#              actually consumes (verified live 2026-09-20: Core CPI 2026-08-13,
#              Core PCE 2026-08-27, PPI 2026-09-11, JOLTS 2026-09-02).
#
# So release dates ARE obtainable. What made the earlier reading defensible was
# that it extrapolated from one provider to "no reachable route exists" without
# enumerating the provider list — the same overstatement class the audit exists
# to find, committed inside the audit.
#
# HONEST LIMITATION, and the reason this is opt-in: the nasdaq route is
# INTERMITTENT and can be BLOCKED.
#
#   * Intermittency: four identical calls on 2026-09-20 returned 2 success and
#     2 failures ("Nasdaq Error -> Economic Events Calendar: No record found."),
#     with a fresh response `id` each time so there is no caching to mask it.
#   * Blocking: later in the same session the upstream host began returning
#     HTTP 403 (text/html) for EVERY nasdaq route, including the unrelated
#     equity/calendar/earnings. That is an upstream IP-level block, not a code
#     fault. The successful reads above are real; they are not reliably
#     reproducible, and whether the route works today depends on a third
#     party's rate limiting.
#
# The mitigation is retry-with-backoff plus a hard rule: when the calendar
# cannot be read, `release_datetime` stays None and the consumption point
# treats timing as UNKNOWN. A scheduled date is never substituted for a
# released one — see `has_known_release_timing`.
#
# `enabled: false` would be the conservative choice given the block. It is left
# `true` so the route is exercised and its health is observable rather than
# silently dormant — and the consequence is made explicit in the snapshot: a
# `enabled: false` is now the default, because a better source exists.
# `publication_dates` (below) is PRIMARY: it reads each series' own
# `last_updated` metadata, needs no event-name join, and was verified at 42/42
# registry coverage with 0 transport errors. This calendar is retained as the
# FALLBACK for series the metadata route cannot reach, and is what a caller
# should re-enable if `publication_dates` ever loses coverage.
#
# Leaving it `true` would impose 5 retries (~15s of sleeps) on EVERY snapshot
# build for a route that is currently edge-blocked, to add nothing the primary
# source does not already provide. The honest description of that is a dead
# cost, not resilience. When the upstream block lifts, flipping this to `true`
# re-enables the merge, and the primary-wins conflict rule keeps the direct
# facts authoritative either way.
#
# With it disabled, a build carries no RELEASE_TIMING_UNKNOWN flag unless the
# PRIMARY source fails — "we did not ask the fallback" is a configuration
# choice, not a data-quality fact.
release_calendar:
  enabled: false
  provider: nasdaq
  endpoint: economy.calendar
  # The provider's own retry budget, separate from the series client's: this
  # route's failure mode is a quick empty response rather than a timeout, so
  # more attempts at a shorter backoff is the right shape.
  max_attempts: 5
  backoff_seconds: 1.5
  # Lookback/lookahead for the calendar query. The window must cover the
  # observation lag we are trying to close (a month's print lands mid-following
  # month) plus room for the newest observation.
  window_days_back: 400
  window_days_forward: 45
  # Event name (as the provider publishes it, matched case-insensitively) ->
  # registry series key. The provider publishes HUMAN-READABLE event names, not
  # FRED symbols, so this mapping is the join and CANNOT be derived.
  #
  # Several names map to one series because the provider publishes the same
  # release more than once at the same timestamp with different units (CPI YoY
  # and CPI MoM both appear as "CPI"). That is fine for a DATE lookup — the
  # timestamp is what is taken — but it is why the event name alone is not a
  # sufficient key for anything but a date.
  #
  # ⚠️ EVERY VALUE HERE MUST BE A KEY IN `series:` ABOVE (enforced by a
  # `SeriesRegistry` validator, Class C/F, audit finding R-1 2026-09-29).
  # A join whose target is not a real registry series is DEAD: the calendar
  # still matches the event and still publishes a date into the index, but
  # `build_snapshot` looks the index up by REGISTRY SERIES KEY
  # (`snapshot_builder.py:_points_from_frame`, `release_index.get(series_id)`),
  # so a phantom key is never read and the date is silently discarded. Four such
  # rows shipped here — `ppi_core`, `nfp`, `gdp_deflator`,
  # `industrial_production` — none of which is a series this engine declares
  # (NFP is a documented absent snapshot field; core PPI is not a consumed
  # input). They are removed rather than repointed, because no real series
  # exists to point at: a join to a series the engine never fetches would be a
  # second kind of lie. Re-add a row ONLY together with its registry series.
  event_map:
    "CPI": cpi_headline
    "Core CPI": cpi_core
    "Core PCE Price Index": pce_core
    "PPI": ppi
    "JOLTS Job Openings": jolts_openings
    "JOLTS Job Quits": jolts_quits
    "Unemployment Rate": unemployment_rate
    "Initial Jobless Claims": initial_claims
    "Continuing Jobless Claims": continuing_claims
    "GDP": gdp_real
    "Retail Sales": retail_sales
    "Durable Goods Orders": durable_goods_orders

# ---------------------------------------------------------------------------
# publication_dates — Section 6's EXACT route for release_datetime (PRIMARY)
# ---------------------------------------------------------------------------
# Each series' own metadata carries `last_updated`: the instant the source last
# wrote that series. Read directly, no join, no scheduled-date inference — so it
# is a better fact than an events-calendar match, and it is the primary source.
#
# VERIFIED LIVE 2026-09-20 — 42/42 registry symbols returned `last_updated`,
# 0 transport errors:
#
#   GET /api/v1/economy/fred_search
#       ?provider=fred&query=<SYMBOL>&search_type=series_id&limit=1000
#   -> results[0].last_updated = "2026-09-11T08:37:49-05:00"    # CPIAUCSL
#
# Why `search_type: series_id` and `limit: 1000` are not arbitrary:
#   * series_id search is a PREFIX match. At limit=5, `UNRATE`, `GDP` and
#     `GDPC1` each returned 5 longer siblings (UNRATECTH, GDPC1CTH, ...) and NO
#     exact match; at limit=1000 all three surfaced. The reader still requires
#     exact `series_id` equality, so the high limit costs bandwidth, not
#     correctness.
#   * `search_type: full_text` is NOT usable for lookup: a 100-row full-text
#     search for "Unemployment Rate" did not contain UNRATE at all.
#
# WHAT THIS IS NOT — read before assuming it fills vintage_datetime:
# The route also returns `realtime_start` / `realtime_end`, which look like
# ALFRED vintage bounds. They are not. For every series both equal TODAY: they
# describe the vintage window in force now, not the revisions that existed
# before. Passing `realtime_start=2026-01-01` is silently IGNORED (A/B tested —
# the two responses differed only in request `timestamp`/`duration`).
# So this fills `release_datetime` and CANNOT fill `vintage_datetime`: "when did
# this become public" and "which revision is this" are different questions, and
# only the first is answerable HERE (this route).
#
# PARTLY SUPERSEDED 2026-09-22 (D-088). The sentence that used to continue
# "...and only the first is answerable here" as "...which stays None" is now
# out of date: `alfred_vintage` below configures a direct ALFRED route that DOES
# fill `vintage_datetime`, for a series declared `vintage_eligible`. Everything
# above stays true of THIS route — the absorption finding is unchanged and this
# block still cannot fill a vintage. The two routes are complementary.
#
# Cross-validated against the events calendar: PCEPILFE reports last_updated
# 2026-08-26 where the calendar dated the Core PCE release 2026-08-27. A one-day
# gap in that direction is exactly the "source wrote it" vs "release happened"
# pair, which confirms the field is a publication timestamp and not an
# observation period.
publication_dates:
  enabled: true
  provider: fred
  endpoint: economy.fred_search
  search_type: series_id
  limit: 1000
  max_attempts: 3
  backoff_seconds: 1.0

# ---------------------------------------------------------------------------
# ALFRED vintage retrieval — the direct route to `vintage_datetime`.
#
# Section 6 names four timestamps per observation and requires they not be
# conflated. Three are populated. `vintage_datetime` has been None on every
# point this system produced, and O-6 records why: `openbb_fred`'s provider
# POPS `realtime_start`/`realtime_end` off every observation row FRED returns
# (models/series.py:156-157) and its query model declares no realtime field,
# so the parameter cannot even be transmitted. Passing it through OpenBB is
# absorbed silently and the LATEST revision comes back with HTTP 200.
#
# This block configures the only route that can answer the question: a direct
# call to FRED's observations endpoint with realtime_start == realtime_end.
#
# THE CREDENTIAL IS BORROWED, NOT DUPLICATED. Section 22.2/22.3 forbid the
# engine holding its own FRED_API_KEY, and O-6's final word cites exactly that
# as the reason this was never built. That objection is honoured here rather
# than waived: NO key is required in `.env` and none is read from the
# environment. The key used is the one OpenBB already owns, read through
# OpenBB's own public accessor. There is one FRED key on this machine.
#
# `enabled: false` — OFF BY DEFAULT, deliberately. A vintage read costs one
# request per (series, as-of date) and is only meaningful to a caller
# replaying history. A live current-thesis build has no as-of dates to
# replay, so leaving it on would add latency to every snapshot and return
# nothing. This mirrors `release_calendar`'s default rather than
# `publication_dates`'s: it is an as-needed research route, not an always-on
# accuracy improvement.
#
# HONEST LIMIT, unchanged by this route (AGENTS.md line 5574, Loophole Ledger
# item 14): this recovers revision HISTORY for series that have it. It does
# NOT make pre-launch vintages recoverable — the forward parquet trail in
# data/raw/ is still what covers "what this process saw", and the two are
# complementary, not substitutes.
# ---------------------------------------------------------------------------
alfred_vintage:
  enabled: false
  require_credential: true
  max_attempts: 3
  backoff_seconds: 1.0
  timeout_seconds: 20.0
  default_lookback_years: 5

