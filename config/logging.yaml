# config/logging.yaml
#
# AGENTS.md Section 10.3 — structured JSON logging.
# Emitted as one JSON object per line so logs are machine-parseable by any
# standard aggregator without a custom parser.

version: 1

# `logging.config.dictConfig` DEFAULTS this to true, and true means "disable
# every logger that already existed and is not a child of one named below".
# Measured: a `urllib3.connectionpool` logger created before
# `configure_logging()` runs comes out `disabled=True` afterwards, so its
# records vanish with no error and no flag. That contradicts this project's own
# rule about logging (logging_json.py: "a service that logs unstructured
# JSON-less output when its config is absent is a service whose logs cannot be
# trusted during the incident that removed the config") — a silently disabled
# logger is worse than an unstructured one, because there is nothing to read at
# all. `false` leaves pre-existing loggers enabled; they propagate to the root
# handler below and are therefore still emitted as JSON.
disable_existing_loggers: false

formatters:
  json:
    format: "%(message)s"
    class: "macro_engine.data_layer.logging_json.JsonFormatter"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: json
    stream: "ext://sys.stdout"

root:
  level: INFO
  handlers: [console]

loggers:
  macro_engine:
    level: INFO
    handlers: [console]
    propagate: false

  # httpx logs every request at INFO, which drowns the data-layer signal
  # during a 20-series snapshot fetch. Warnings still surface.
  httpx:
    level: WARNING

  openbb:
    level: WARNING
