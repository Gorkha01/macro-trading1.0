name: quality-gates

# Phase 0 Definition of Done (AGENTS.md Section 11): pytest collects and
# passes, ruff clean, mypy clean. The offline suite runs here; the live tests
# are excluded because a network dependency in CI is how a suite becomes
# something people learn to ignore — and a provider outage would then look
# like a code regression.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --extra dev --frozen

      - name: Lint (ruff check)
        run: uv run ruff check src/ tools/ tests/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/ tools/ tests/

      - name: Type check (mypy --strict)
        run: uv run mypy

      # DEFECTS_2026-09-19.md item 3. A unit test tests the callee and a
      # mutation sweep mutates the callee — neither asks whether the PIPELINE
      # CALLS IT, which is how 59 Tier 1-4 functions came to be implemented,
      # tested, and unreachable. This gate asks that question. It fails on a
      # REGRESSION (a function that was reachable and stopped being) rather
      # than on the known, triaged backlog, so it stays a signal instead of
      # becoming noise people learn to ignore.
      - name: Reachability gate (no new unreachable model functions)
        run: uv run python tools/reachability_audit.py --check-baseline

      # O-72, O-63. `sweep_health.py` was the project's most valuable gate and it
      # ran BY HAND ONLY -- "gates run by hand from prose, and prose cannot refuse"
      # (O-63). It proves every sweep LOADS, every anchor RESOLVES, and no mutant
      # is left on disk or committed; those are exactly the failures that have
      # recursed here (O-61 three times, O-98, O-102, O-109). It is cheap (seconds),
      # stdlib-only, and needs no service -- it degrades to "could not ask git"
      # rather than failing in a fresh clone -- so it belongs in the merge gate.
      #
      # Placed BEFORE the suite so a dirty tree fails fast (the suite is the
      # long step, and there is no point running it on a tree carrying a mutant).
      # Note the converse: this is a PHOTOGRAPH of the tree, so it cannot see a
      # change made after it runs -- locally, run it LAST.
      - name: Sweep health (no left-on-disk or committed mutants)
        run: uv run python tools/sweep_health.py

      - name: Test suite (offline)
        run: uv run pytest -m "not live"

  # Manual/ scheduled job for the live data path. Requires FRED reachability.
  live-data:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev --frozen

      # O-111(a) ENFORCED. The probe exists and is documented as Step 0, but
      # nothing ran it automatically -- and the step below is exactly where it
      # matters. `pytest -m live` SKIPS the registry-coverage checks when the
      # service is down (correctly: an external dependency being unavailable is
      # not a regression in this repository), so a dead endpoint turns this job
      # GREEN while deleting assertions. That is the O-111 incident one level up,
      # and a skip cannot distinguish "I chose to run offline" from "the thing I
      # depend on has been dead all day".
      #
      # Exit codes are the contract (O-88): 0 serving, 1 not serving, 2 could not
      # run. A non-zero exit FAILS the job, which is the point -- this is the one
      # place where an unserving OpenBB instance is a real failure rather than a
      # reason to skip.
      - name: OpenBB reachability (fails if the configured URL does not SERVE)
        run: uv run python tools/openbb_reachability.py

      - name: Live data-layer tests
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run pytest -m live
