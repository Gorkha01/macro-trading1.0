name: quality-gates

# Phase 0 Definition of Done (AGENTS.md Section 11): pytest collects and
# passes, ruff clean, mypy clean.
#
# SCOPE 2026-10-08. `tools/` and `scripts/` are no longer versioned — the
# repository carries production code and its tests — so a CI checkout contains
# `src/`, `tests/`, `config/`, `docs/`, `AGENTS.md` and `pyproject.toml`, and
# nothing else. Every step that named `tools/` or `scripts/` failed with
# `EM902 No such file or directory`. Those steps are GONE rather than repaired:
# a step cannot pass against a tree that does not contain what it reads.
#
# What was REMOVED, and why:
#
#   * "Reachability gate" (`tools/reachability_audit.py`) and "Sweep health"
#     (`tools/sweep_health.py`) — both are `tools/` scripts, and sweep_health
#     additionally reads `scripts/` (the 52 mutation sweeps). Neither tree
#     ships. Both remain runnable LOCALLY and are now local-only gates.
#   * The `live-data` job's "OpenBB reachability" step
#     (`tools/openbb_reachability.py`) — same reason. The live TEST run below
#     is retained, but note the O-111(a) argument that motivated the probe: a
#     dead endpoint turns the live run GREEN by skipping the registry-coverage
#     assertions, and the probe was what caught that. With the probe gone,
#     `pytest -m live` can go green while deleting assertions. Run
#     `tools/openbb_reachability.py` by hand before trusting a live run.
#
# The offline suite IS retained — it needs only `tests/`, which is versioned.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --extra dev --frozen

      # Scope is `src/ tests/`. `scripts/` was added to this step deliberately
      # at D-136 (the 52 mutation sweeps are real logic, ~40k lines, and the
      # only code in the repository that rewrites `src/` at runtime). It is no
      # longer versioned, so it is no longer linted here; that check is now
      # local-only.
      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/ tests/

      # `mypy` reads its scope from `pyproject.toml` (`files = ["src", "tests"]`).
      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Test suite (offline)
        run: uv run pytest -m "not live"

  # Manual/ scheduled job for the live data path. Requires FRED reachability.
  live-data:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev --frozen

      - name: Live data-layer tests
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        # O-110: this is the one job that deliberately goes to the network, so it
        # is the one where an unbounded test can hang a runner. `--timeout` is set
        # globally in `addopts` (600 s, derived from the slowest real test); the
        # per-test limit is repeated here EXPLICITLY rather than relied upon
        # implicitly, because this job selects `-m live` -- a different marker
        # expression from the default -- and a reader of this file should see that
        # the expensive path is bounded without having to resolve `addopts`.
        # `--session-timeout` caps the whole run: it is checked between tests, so
        # it cannot rescue a single hung test (the per-test limit does that); its
        # job is to stop "many tests, each just under the limit" from consuming
        # the runner's entire budget.
        run: uv run pytest -m live --timeout=300 --session-timeout=3600
