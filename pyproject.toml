[project]
name = "macro-reasoning-engine"
version = "1.0.0"
description = "Global Macro Reasoning Engine — OpenBB-backed institutional macro thesis synthesis service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Phase 1 only — see AGENTS.md Section 4. No dependency is imported
    # before the phase that actually needs it.
    "openbb>=4.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.2",
    "pyarrow>=16.0.0",
    "sqlalchemy>=2.0.54",
    "openbb-fred>=1.6.2",
    "openbb-economy>=1.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_engine"]

# PEP 561 marker: without it, mypy treats an installed `macro_engine` as
# untyped when analysing `tests/`, reporting 30+ import-untyped errors that
# mask real ones. The marker is what makes the package's own annotations
# visible to consumers — which is the whole point of `mypy --strict`.
[tool.hatch.build.targets.wheel.force-include]
"src/macro_engine/py.typed" = "macro_engine/py.typed"

# ---------------------------------------------------------------------------
# Ruff — lint + format. Section 10.2 requires a clean run on every module.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez  <- enforces the datetime.now(timezone.utc) rule
    "T20",    # flake8-print     <- no stray print() in library code
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit
]
ignore = [
    "ANN401",  # Any is explicitly permitted for OpenBB raw payload handling
    "S101",    # assert is fine in tests
    "UP042",   # `class X(str, Enum)` is the pattern the specification uses
               # throughout; StrEnum would change `.value` semantics subtly
               # (and is 3.11+ only) for no benefit here.
    "RUF007",  # `zip(xs, xs[1:])` is clearer than itertools.pairwise for
               # consecutive-pair interpolation over a short config list.
]

# ruff/mypy have no `files` key of their own — they walk whatever path the
# invocation names. `mypy` below carries the authoritative `files` list
# (§10.2, D-035); ruff is invoked with the SAME paths by the close-out gate
# (`uv run ruff check src tests tools scripts`). Naming `.probe/` or the
# ignored directories here would make a bare `ruff check` silently report on
# files the project does not own, which is how a "clean" claim becomes
# unreproducible (O-63).
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN201", "ANN001", "ANN202"]
# S603/S607 on the sweep-health guards, scoped to the files that legitimately
# invoke `git`. Those calls carry a fixed argv with no shell and no interpolated
# user input, so the "untrusted input" and "partial executable path" hazards the
# rules exist for are absent. Scoping by file (rather than a `# noqa` per line)
# keeps the rules live everywhere else (D-067).
"tests/test_sweep_health_leftover_predicate.py" = ["S603", "S607"]
# `tests/thesis_layer/test_warnings.py` and its siblings print their measurements
# in the LIVE tests. The live tests are the project's measurement instrument
# (Section 21.0's real-data execution step): they are deselected from the default
# run and run by hand with `-m live`, and their value is the printed census, not
# only the assertions. Restricting the exemption to the live path would mean a
# `# noqa` on every line, which hides the rule instead of scoping it (D-067).
"tests/thesis_layer/*.py" = ["T20"]
"tools/*.py" = ["T20", "S603", "S607"]        # CLI tools are allowed to print
# Operator scripts print: their entire purpose is to show a human what the
# live system returns (Section 21.0's real-data execution step). They are run
# by hand, never imported, and excluded from the default test run.
"scripts/*.py" = ["T20", "DTZ011", "S310"]
# `DTZ011`/`S310`: an operator script's whole job is to read the REAL current
# date and hit a REAL URL — that is the difference between a live check and a
# unit test (Section 21.0). Scoping the two rules to this directory keeps them
# live in `src/` and `tests/`, which is the D-067 pattern. `urllib` is used
# directly in a few probes where the point is to BYPASS the project's client
# and observe the provider's raw answer.
"src/macro_engine/api_layer/*.py" = []
# `test_release_calendar.py` asserts NAIVE datetimes on purpose. The provider's
# wire format is a naive ISO string ("2026-08-13T08:30:00") and
# `release_calendar._parse_event_datetime` returns it unlocalised by design:
# inventing an offset would be an inference the module has no basis for and
# could move a release across a day boundary relative to `as_of`. The test's job
# is to pin that exact behaviour, so a tz-aware literal would assert something
# the code does not do. Scoping the exemption to the file (rather than a
# `# noqa` per line) keeps the rule live everywhere else (D-067).
"tests/data_layer/test_release_calendar.py" = ["DTZ001"]
# Mutation sweeps quote SHIPPED SOURCE TEXT verbatim as their `old` anchors, and
# `check_targets` refuses to run unless each anchor matches the file exactly
# (D-048). A line-length rule therefore cannot be satisfied without either
# reflowing the anchor -- which would make it stop matching the source it is
# supposed to pin -- or exempting the rule here. Scoping it to the sweep
# directory keeps E501 live everywhere else, which is the same choice D-067
# records for `tests/portfolio/test_release_calendar`'s naive datetimes. The
# sweeps' own logic is not exempt: only the transcribed string constants are
# long, and `ruff format` still governs the rest of each file.
"scripts/mutation_*.py" = ["T20", "E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# mypy --strict — Section 10.2. NOTE: the spec says "mypy --strict clean",
# enforced via disallow_untyped_defs + friends below.
# ---------------------------------------------------------------------------
[tool.mypy]
# Set to 3.12 to match the interpreter actually in use and the syntax level of
# numpy's bundled stubs ("type X = ..." statements are 3.12+ only). Declaring
# 3.11 here made mypy reject numpy's own .pyi files, which prevented it from
# checking anything at all — a false pass that looked like a clean run.
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
# SCOPE 2026-10-08. The list was `["src", "tests", "tools", "scripts"]` (see the
# D-035 note it replaced: the documented scope and the default scope had to be
# the same thing for a green run to mean what the records claim).
# `tools/` and `scripts/` are no longer versioned — the repository carries
# production code and its tests — so a CI checkout contains `src/` and `tests/`
# and nothing else, and naming a directory that is not there makes mypy exit
# non-zero before it checks anything (measured: `EM902 No such file or
# directory`). Hence `["src", "tests"]`. The tooling is still type-checked
# LOCALLY, where that tree exists; what changed is that a green CI run is a
# statement about `src/` and `tests/` only.
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["openbb.*", "statsmodels.*", "scipy.*", "pyarrow.*"]
ignore_missing_imports = true

# D-101: `econometrics.py` subclasses `statsmodels.tsa.statespace.MLEModel` so
# that the state-space matrices are written explicitly rather than inferred by a
# convenience class. statsmodels ships without type information, so the base
# resolves to `Any` and `--strict` refuses the subclass.
#
# The relaxation must name the module that DECLARES the subclass, not the
# library: `disallow_subclassing_any` is reported where the `class` statement
# is, so adding it to the statsmodels override above has NO EFFECT (measured --
# the error is raised at econometrics.py's class line, and an override on
# `statsmodels.*` never sees it). An option that reads as protection and does
# nothing is worse than no option, which is why it is not left there.
#
# This permits only the untyped BASE. Every member the subclass defines is still
# checked in full.
[[tool.mypy.overrides]]
module = ["macro_engine.models.econometrics"]
disallow_subclassing_any = false

# ---------------------------------------------------------------------------
# pytest — Section 10.1 test strategy
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "tools"]
# D-087: `-m "not live and not slow"` is the DEFAULT. The `live` marker was
# always documented as "excluded from default CI runs" but nothing enforced it,
# so a plain `uv run pytest` fanned out ~21 network calls with 3 retries x 15s
# timeout each and could run for tens of minutes on one test (worst case measured
# at >40 min for a single live snapshot build). Pin run the same either way, but
# a live run makes its cost explicit; and a default run cannot be dragged by a
# slow provider. The `slow` marker is the exhaustive-catalogue guard (~4 min).
#
# D-087.27 (O-110) adds the SECOND half: `--timeout`. Excluding `live` by marker
# bounds what a DEFAULT run touches, but nothing bounded a single test once it
# was asked for — a `-m live` run, or a test that quietly opened a socket, could
# still hang forever. There is now a per-test limit.
#
# `--timeout=300` is DERIVED, not chosen: the slowest legitimate offline test
# measures **349.78 s** (`test_the_two_copies_agree_on_the_real_catalogue`, which
# loads all 45 sweeps and execs each one), so 300 s NO LONGER clears it and this
# bound is now **600 s** — ~1.7x the measured worst case, still catching the
# pathological hang (measured >40 min). A timeout BELOW the real worst case is
# worse than none: it kills a correct test, and on `win32` the kill leaves no
# `finally` — file-based protection (the sweep sidecars) is the only thing that
# survives, which is why the bound and the sidecars are complements.
#
# **D-110 raised this from 300 to 600, and the reason is worth keeping.** The
# prior value was derived from a **162 s** measurement against 42 sweeps. Both
# numbers moved: the catalogue grew to 45 sweeps, and `mutation_fx_carry.py`
# itself grew from 71 to 114 mutations, so the agreement test now execs a larger
# module per sweep. Measured at D-110 with `--timeout=900`: **349.78 s, PASS**.
# The 300 s bound was therefore killing a correct test — the exact failure mode
# the paragraph above warns about — and it was found because the slow marker was
# run EXPLICITLY rather than assumed to be covered by the default set.
#
# `--timeout-method` is left at the default (`signal` where SIGALRM exists,
# `thread` on win32). It MUST NOT be pinned to `signal`: on this platform that
# would silently disable the timeout, which is the O-110 defect restored.
#
# `--session-timeout=5400` is a belt-and-braces bound on the whole run: it is
# checked between tests and cannot interrupt one, so it is a backstop for "many
# tests each under the per-test limit" rather than a substitute for it. Measured
# offline total: ~323 s; the full `-m live` path is the unbounded one this caps.
# It still clears 5400 s with the raised per-test bound: the slow test is the
# only one near the limit and it is deselected by default.
addopts = "-ra --strict-markers --strict-config -m 'not live and not slow' --timeout=600 --session-timeout=5400"
markers = [
    "live: hits a real external data source; excluded from default CI runs",
    "offline: no network access required",
    "golden: hand-verified expected-value test (Section 21.2 Step 4)",
    "warning_path: proves a ModelResult.warnings condition actually fires (Section 21.2 Step 5)",
    # D-136: the count was 45 when this line was written and the catalogue is 52
    # now. A stale number here is not cosmetic -- this marker decides whether CI
    # spends minutes on a test, so a reader sizing the run from this string is
    # mis-sized by ~16%.
    "slow: loads all 52 mutation sweeps (~6 min); correctness is unaffected by deselection",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pytest-timeout>=2.4.0",
]
